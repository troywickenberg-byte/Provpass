<style>
/* Layout: "svarsblankett" — a ruled header strip, then the provpass library, or the original test page beside a digital answer sheet. */
:root{
  --paper:#F4F5F8; --sheet:#FFFFFF; --ink:#1B2130; --soft:#5A6275; --line:#DCDFE6;
  --form:#C2255C; --form-tint:#FBE6EE; --quant:#0E6E70; --quant-tint:#DCF0EF;
  --ok:#2E7A32; --ok-tint:#E2F1E3; --bad:#B3261E; --bad-tint:#FBE7E5; --warn:#8A5A00; --warn-tint:#FBF0D9; --graphite:#2D323D;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141B; --sheet:#191D26; --ink:#E7E9EF; --soft:#A1A8B7; --line:#2B3140;
  --form:#F06A9A; --form-tint:#3A1A28; --quant:#43C6BC; --quant-tint:#123130;
  --ok:#6CC370; --ok-tint:#1A2E1C; --bad:#FF8C82; --bad-tint:#3A1D1B; --warn:#F2C062; --warn-tint:#33280F; --graphite:#D9DCE4; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141B; --sheet:#191D26; --ink:#E7E9EF; --soft:#A1A8B7; --line:#2B3140;
  --form:#F06A9A; --form-tint:#3A1A28; --quant:#43C6BC; --quant-tint:#123130;
  --ok:#6CC370; --ok-tint:#1A2E1C; --bad:#FF8C82; --bad-tint:#3A1D1B; --warn:#F2C062; --warn-tint:#33280F; --graphite:#D9DCE4; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--form);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.note{font-size:13px;color:var(--soft)}

.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:14px;border-bottom:2px solid var(--form);position:relative}
.mast::after{content:"";position:absolute;left:0;right:0;bottom:-7px;border-bottom:1px solid var(--form);opacity:.5}
.brand{display:flex;align-items:baseline;gap:12px;background:none;border:0;padding:0}
.brand h1{font-size:clamp(26px,4vw,34px);font-weight:800;letter-spacing:-.02em}
.brand .tag{font-family:var(--f-mono);font-size:12px;color:var(--form);border:1px solid var(--form);border-radius:4px;padding:1px 6px}
.status{font-size:13px;color:var(--soft);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--soft)}
.dot.on{background:var(--ok)}

.btn{border:1.5px solid var(--ink);background:var(--sheet);border-radius:999px;padding:9px 18px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:var(--line)}
.btn.small{padding:5px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:not(:disabled):hover{transform:translateY(-1px)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.link{background:none;border:0;padding:0;color:var(--soft);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel h3{font-size:18px;margin-bottom:10px}

/* home */
.intro{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;margin:28px 0 8px}
.intro p{margin:6px 0 0;color:var(--soft);max-width:62ch}
.intro h2{font-size:clamp(22px,3vw,28px)}
.countdown{display:flex;flex-direction:column;gap:8px}
.countdown .big{font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1}
.countdown input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}

.drop{margin-top:24px;border:2px dashed var(--line);border-radius:var(--r);padding:22px;background:var(--sheet);display:grid;gap:10px;justify-items:start}
.drop.over{border-color:var(--form);background:var(--form-tint)}
.drop h3{font-size:20px}
.drop p{margin:0;color:var(--soft);max-width:65ch}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.problems{margin:0;padding-left:18px;color:var(--bad);font-size:14px}

.lib{margin-top:28px;display:grid;gap:16px}
.exam h3{font-size:20px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.exam h3 .label{font-size:11px}
.passes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.pass{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.pass-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.pass-head strong{font-family:var(--f-display);font-size:17px}
.chip{font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:4px;border:1px solid transparent;background:transparent}
.chip.v{background:var(--form-tint);color:var(--form)} .chip.k{background:var(--quant-tint);color:var(--quant)}
button.chip:hover{border-color:currentColor}
.chip.missing{background:var(--warn-tint);color:var(--warn)}
.chip.okc{background:var(--ok-tint);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.part{margin-top:32px}
.part-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.part-head h3{font-size:20px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .code{font-family:var(--f-mono);font-weight:500;font-size:13px;padding:2px 8px;border-radius:4px;align-self:flex-start}
.v .code{background:var(--form-tint);color:var(--form)}
.k .code{background:var(--quant-tint);color:var(--quant)}
.card h4{margin:0;font-family:var(--f-display);font-size:17px;font-weight:700;line-height:1.2}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px}
.v .meter i{background:var(--form)} .k .meter i{background:var(--quant)}
.stat{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--soft)}
.card .acts{margin-top:auto}
.card .acts button{width:100%;border:1px solid var(--line);background:transparent;border-radius:6px;padding:7px 10px;text-align:left;font-size:14px}
.card .acts button:hover:not(:disabled){border-color:var(--ink)}
.card .acts button:disabled{opacity:.5;cursor:not-allowed}

.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:36px}
table.log{width:100%;border-collapse:collapse;font-size:14px}
table.log td,table.log th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.log th{font-weight:400;color:var(--soft);font-size:12px}
table.log td.n,table.log th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.empty{color:var(--soft);font-size:14px;margin:0}

/* quiz */
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;margin-top:20px;align-items:start}
.viewer{display:grid;gap:12px;min-width:0}
.vbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.pages{display:grid;gap:12px}
.pages.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.pg{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-height:200px;display:grid;place-items:center;color:#5A6275;font-size:14px}
.pg canvas{display:block;width:100%;height:auto}
.side{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px}
.clock{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.clock .big{font-family:var(--f-mono);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums}
.clock.low .big{color:var(--bad)}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qhead strong{font-family:var(--f-display);font-size:20px}
.bubbles{display:flex;gap:8px;flex-wrap:wrap}
.bub{width:46px;height:34px;border-radius:50%;border:2px solid var(--form);background:transparent;color:var(--form);font-family:var(--f-mono);font-size:15px;font-weight:500}
.kq .bub{border-color:var(--quant);color:var(--quant)}
.bub.on{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
.qtime{font-size:13px;color:var(--soft)}
.sheetgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.sheetgrid button{border:1px solid var(--line);background:transparent;border-radius:4px;padding:3px 0;font-family:var(--f-mono);font-size:12px;line-height:1.2}
.sheetgrid button .a{display:block;font-size:11px;color:var(--soft);min-height:1.2em}
.sheetgrid button.done{background:var(--paper)}
.sheetgrid button.done .a{color:var(--ink);font-weight:500}
.sheetgrid button.cur{border-color:var(--ink);border-width:2px}
.sheetgrid button.nf{border-style:dashed}
.secsep{grid-column:1/-1;font-family:var(--f-mono);font-size:11px;color:var(--soft);margin-top:4px}

/* result */
.result-top{margin-top:24px;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:24px}
.score{font-family:var(--f-display);font-size:64px;font-weight:800;line-height:1}
.score small{font-size:24px;color:var(--soft);font-weight:500}
.pattern{margin-top:24px}
.insights{margin:0;padding-left:18px;display:grid;gap:8px}
.tag{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tag.fast{background:var(--warn-tint);color:var(--warn)}
.tag.slow{background:var(--form-tint);color:var(--form)}
.tag.norm{background:var(--paper);color:var(--soft);border:1px solid var(--line)}
.tag.ok{background:var(--ok-tint);color:var(--ok)}
.tag.bad{background:var(--bad-tint);color:var(--bad)}
.tag.nf{background:var(--warn-tint);color:var(--warn)}
.tbl-wrap{overflow-x:auto}
.items{display:grid;gap:10px;margin-top:24px}
.item{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.item.bad{border-left:4px solid var(--bad)}
.item-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.item-head strong{font-family:var(--f-display)}
.expl{font-size:15px;white-space:pre-wrap;background:var(--paper);border-radius:8px;padding:12px 14px;max-width:80ch}
.expl .src{display:block;font-size:12px;color:var(--soft);margin-bottom:6px;white-space:normal}
.thumb{max-width:520px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:14px}
.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
.busy{display:flex;gap:10px;align-items:center;color:var(--soft);font-size:14px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--form);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

@media (max-width:980px){.qwrap{grid-template-columns:minmax(0,1fr)}.side{position:sticky;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));order:2}.pages.two{grid-template-columns:minmax(0,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.intro,.lower,.result-top,.passes{grid-template-columns:minmax(0,1fr)}.sheetwrap{display:none}.sheetwrap.open{display:block}}
@media (min-width:701px){.sheettoggle{display:none}}
@media (max-width:420px){.grid{grid-template-columns:minmax(0,1fr)}.bub{width:40px}}

/* flikar */
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:6px 10px;font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--soft)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--form)}
.tabs button:hover{color:var(--ink)}

/* snabbräkning */
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 4px}
.subnav button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;font-size:14px}
.subnav button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.warnbox{margin-top:14px;background:var(--warn-tint);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:14px}
.today{margin-top:18px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
.bignums{display:flex;gap:28px;flex-wrap:wrap;margin:10px 0 16px}
.bignums div{display:grid}
.bignums b{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1}
.catlist{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.catlist li{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px solid var(--line);padding:4px 0}
.drill{max-width:640px;margin:26px auto 0;display:grid;gap:16px}
.drill-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cardq{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:28px 22px;display:grid;gap:18px;justify-items:center;text-align:center}
.cardq .qtext{font-family:var(--f-display);font-size:clamp(28px,6vw,44px);font-weight:700;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
.cardq .qtext.long{font-size:clamp(20px,4.4vw,28px)}
.ansrow{display:flex;gap:8px;width:100%;max-width:440px}
.ansrow input{flex:1;min-width:0;font-family:var(--f-mono);font-size:26px;padding:10px 14px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);text-align:center}
.ansrow input:focus{border-color:var(--ink);outline:none}
.keys{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.keys button{min-width:44px;height:40px;border:1px solid var(--line);background:var(--paper);border-radius:8px;font-family:var(--f-mono);font-size:17px}
.keys button.wide{padding:0 14px;font-family:var(--f-body);font-weight:700}
.choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.choices button{min-width:130px;padding:16px 22px;border:2px solid var(--line);background:var(--paper);border-radius:12px;font-family:var(--f-display);font-size:30px;font-weight:700}
.choices button:hover{border-color:var(--ink)}
.tbar{position:relative;height:8px;width:100%;max-width:440px;border-radius:4px;background:var(--line);overflow:hidden}
.tbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);width:0}
.tbar i.good{background:var(--quant)} .tbar i.hard{background:var(--warn)}
.tbar s{position:absolute;top:0;bottom:0;width:2px;background:var(--sheet)}
.fb{display:grid;gap:8px;justify-items:center}
.fb .verdict{font-family:var(--f-display);font-size:22px;font-weight:800}
.fb .verdict.ok{color:var(--ok)} .fb .verdict.bad{color:var(--bad)}
.fb .ex{max-width:52ch;background:var(--paper);border-radius:8px;padding:10px 14px;font-size:15px;text-align:left}
.grade{font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:4px}
.grade.g1{background:var(--bad-tint);color:var(--bad)} .grade.g2{background:var(--warn-tint);color:var(--warn)}
.grade.g3{background:var(--quant-tint);color:var(--quant)} .grade.g4{background:var(--ok-tint);color:var(--ok)}
.setrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.setrow input[type=number]{width:64px;font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.setrow .sub{grid-column:2/-1;display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--soft);align-items:center}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.setgrid label{display:grid;gap:4px;font-size:14px}
.setgrid input,.setgrid select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.copybox{width:100%;min-height:160px;font-family:var(--f-mono);font-size:12px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
@media (max-width:700px){.today{grid-template-columns:minmax(0,1fr)}.setrow{grid-template-columns:auto minmax(0,1fr)}.tabs{margin-left:0;order:3;width:100%}}
</style>

<div class="wrap">
  <header class="mast">
    <button class="brand" id="home-btn" type="button" aria-label="Till startsidan"><h1>Provpass HP</h1><span class="tag">gamla prov</span></button>
    <nav class="tabs" aria-label="Delar av appen">
      <button type="button" id="tab-prov" class="on" aria-current="page">Gamla prov</button>
      <button type="button" id="tab-sr">Snabbräkning</button>
    </nav>
    <div class="status"><span class="dot" id="sdot"></span><span id="stext">Sparas på den här enheten</span></div>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
// ================= Snabbräkning: kortbibliotek, rättning, FSRS och lagring =================
const SR = (function(){
const DAY = 86400000;
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pickr = a => a[Math.floor(Math.random()*a.length)];
const gcd = (a,b) => { a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a; };
const SUPD = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const sup = n => String(n).split('').map(c=> c==='-' ? '⁻' : SUPD[+c]).join('');
const fmtN = x => { if (typeof x!=='number' || !isFinite(x)) return String(x); return Number(x.toPrecision(10)).toLocaleString('sv-SE',{maximumFractionDigits:6}); };
const M = '−';
const sgn = n => n<0 ? ` ${M} ${Math.abs(n)}` : ` + ${n}`;
const dayKey = (t=Date.now()) => { const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const endOfToday = () => { const d=new Date(); d.setHours(23,59,59,999); return d.getTime(); };
const isPrime = n => { if (n<2) return false; for (let i=2;i*i<=n;i++) if (n%i===0) return false; return true; };
const primeFactors = n => { const f=[]; for (let p=2;p*p<=n;p++) while(n%p===0){ f.push(p); n/=p; } if (n>1) f.push(n); return f; };
const factorStr = n => { const f=primeFactors(n), c={}; f.forEach(p=>c[p]=(c[p]||0)+1); return Object.entries(c).map(([p,k])=>k>1?p+sup(k):p).join(' · '); };

// ---------- Kategorier. Lägg till en ny genom att anropa cat(...) med fasta kort och/eller mallar. ----------
// limits = [Lätt under s, Bra under s]; långsammare än Bra blir Svårt.
const CATS = [];
function cat(id, name, limits, build){
  const c = {id, name, limits, cards:[]};
  const add = o => { o.cat = id; o.id = id+':'+o.id; c.cards.push(o); };
  build(add); CATS.push(c); return c;
}

  for (const [p,q] of FR){

  }
});

  };

  }});

const CARDS = {}; for (const c of CATS) for (const k of c.cards) CARDS[k.id] = k;
const CATBY = Object.fromEntries(CATS.map(c=>[c.id,c]));

// ---------- Tolkning av svar ----------
const SUPMAP = {'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-'};
function norm(s){
  s = String(s).trim().toLowerCase()
    .replace(/[−–—]/g,'-').replace(/[·×∙•⋅]/g,'*').replace(/÷/g,'/').replace(/,/g,'.')
    .replace(/sqrt/g,'√').replace(/pi/g,'π').replace(/≈/g,'');
  s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g, m=>'^('+[...m].map(c=>SUPMAP[c]).join('')+')');
  s = s.replace(/½/g,'(1/2)').replace(/⅓/g,'(1/3)').replace(/¼/g,'(1/4)').replace(/¾/g,'(3/4)');
  return s.replace(/\s+/g,'');
}
function tokens(s){
  const out=[]; let i=0;
  while (i<s.length){
    const c = s[i];
    if (/[0-9.]/.test(c)){ let j=i; while (j<s.length && /[0-9.]/.test(s[j])) j++; const t=s.slice(i,j); if (!/^(\d+\.?\d*|\.\d+)$/.test(t)) throw 0; out.push({t:'n', v:parseFloat(t)}); i=j; continue; }
    if (/[a-zåäö]/.test(c)){ out.push({t:'v', v:c}); i++; continue; }
    if (c==='π'){ out.push({t:'n', v:Math.PI}); i++; continue; }
    if ('+-*/^()%√'.includes(c)){ out.push({t:c}); i++; continue; }
    throw 0;
  }
  return out;
}
function parse(src){
  const tk = tokens(norm(src)); let p = 0;
  const peek = () => tk[p], eat = t => (tk[p] && tk[p].t===t) ? (p++, true) : false;
  function expr(){ let a=term(); while (peek() && (peek().t==='+'||peek().t==='-')){ const op=tk[p++].t; a={t:op, a, b:term()}; } return a; }
  function term(){ let a=unary(); for(;;){ const q=peek(); if (!q) break;
    if (q.t==='*'||q.t==='/'){ p++; a={t:q.t, a, b:unary()}; }
    else if (q.t==='n'||q.t==='v'||q.t==='('||q.t==='√'){ a={t:'*', a, b:power()}; }
    else break; } return a; }
  function unary(){ if (eat('-')) return {t:'neg', a:unary()}; if (eat('+')) return unary(); return power(); }
  function power(){ const a=postfix(); if (eat('^')) return {t:'^', a, b:unary()}; return a; }
  function postfix(){ let a=primary(); while (eat('%')) a={t:'pct', a}; return a; }
  function primary(){ const q=tk[p++]; if (!q) throw 0;
    if (q.t==='n') return {t:'num', v:q.v};
    if (q.t==='v') return {t:'var', v:q.v};
    if (q.t==='('){ const e=expr(); if (!eat(')')) throw 0; return {t:'par', a:e}; }
    if (q.t==='√') return {t:'sqrt', a:power()};
    throw 0; }
  const r = expr(); if (p<tk.length) throw 0; return r;
}
function ev(n, env){
  switch(n.t){
    case 'num': return n.v; case 'var': return env && n.v in env ? env[n.v] : NaN; case 'par': return ev(n.a,env);
    case '+': return ev(n.a,env)+ev(n.b,env); case '-': return ev(n.a,env)-ev(n.b,env);
    case '*': return ev(n.a,env)*ev(n.b,env); case '/': return ev(n.a,env)/ev(n.b,env);
    case '^': return Math.pow(ev(n.a,env), ev(n.b,env)); case 'neg': return -ev(n.a,env);
    case 'sqrt': return Math.sqrt(ev(n.a,env)); case 'pct': return ev(n.a,env)/100;
  }
  return NaN;
}
const hasVar = n => n.t==='var' || ['a','b'].some(k=>n[k] && hasVar(n[k]));
const unpar = n => { while (n.t==='par') n = n.a; return n; };
const close = (a,b,tol) => tol ? Math.abs(a-b) <= tol*Math.abs(b) + 1e-12 : Math.abs(a-b) <= 1e-9*Math.max(1,Math.abs(b));
const UNITS = /\s*(km\/h|m\/s|cm²|cm2|dm²|dm2|m²|m2|km²|dm³|dm3|cm³|cm3|m³|m3|liter|l|ml|dl|minuter|min|timmar|h|°|grader|kr|km)\s*$/i;
function numVal(raw){ const t = parse(String(raw).replace(UNITS,'')); if (hasVar(t)) throw 0; const v = ev(t); if (!isFinite(v)) throw 0; return v; }

// returnerar {ok, note?} eller {invalid:true}
function check(inst, raw, tolOverride){
  const tol = tolOverride ?? inst.tol ?? 0;
  try{
    switch(inst.kind){
      case 'num': { const v = numVal(raw); return {ok: close(v, inst.ans, tol)}; }
      case 'pct': {
        const hasPct = /%/.test(raw), v = numVal(String(raw).replace(/%/g,''));
        const targets = [inst.ans, ...(inst.alt||[])];
        const ok = targets.some(t => close(v, t, tol)) || (!hasPct && !/\//.test(raw) && targets.some(t => t!==0 && close(v, t/100, tol)));
        return {ok};
      }
      case 'reduced': {
        const s = norm(raw), m = s.match(/^(-?\d+)\/(\d+)$/);
        const v = numVal(raw);
        if (!close(v, inst.ans)) return {ok:false};
        if (m && gcd(+m[1], +m[2])!==1) return {ok:false, note:'Rätt värde, men bråket är inte fullt förkortat.'};
        if (!m && !Number.isInteger(v)) return {ok:false, note:'Skriv svaret som ett förkortat bråk, till exempel 2/3.'};
        return {ok:true};
      }
      case 'factor': {
        const s = String(raw).trim().toLowerCase();
        const claimPrime = s==='__prime__' || /^prim/.test(s);
        if (claimPrime) return {ok:isPrime(inst.n), note: isPrime(inst.n) ? null : `${inst.n} är inte ett primtal.`};
        if (isPrime(inst.n)) return {ok:false, note:`${inst.n} är ett primtal. Tryck på Primtal.`};
        const parts = norm(s).replace(/x/g,'*').split('*').filter(Boolean);
        let prod = 1, allPrime = true;
        for (const part of parts){
          const m = part.match(/^(\d+)(?:\^\(?(\d+)\)?)?$/); if (!m) return {invalid:true};
          const b = +m[1], k = m[2] ? +m[2] : 1;
          if (!isPrime(b)) allPrime = false;
          prod *= b**k;
        }
        if (prod!==inst.n) return {ok:false};
        if (!allPrime) return {ok:false, note:'Rätt produkt, men alla faktorer är inte primtal. Faktorisera vidare.'};
        return {ok:true};
      }
      case 'choice': return {ok: Number(raw)===inst.correct};
      case 'expr': {
        const u = parse(raw), e = parse(inst.expr);
        let tested = 0;
        for (let i=0;i<14 && tested<6;i++){
          const env = {}; for (const v of inst.vars) env[v] = (Math.random()*7.4 - 3.7) || 1.13;
          const want = ev(e, env); if (!isFinite(want)) continue;
          const got = ev(u, env); tested++;
          if (!isFinite(got) || Math.abs(got-want) > 1e-6*Math.max(1,Math.abs(want))) return {ok:false};
        }
        if (tested<3) return {invalid:true};
        const r = unpar(u);
        if (inst.mode==='factor' && (r.t==='+' || r.t==='-' || r.t==='/' || !hasVar(r))) return {ok:false, note:'Rätt värde, men skriv det som en produkt, till exempel (x + 4)(x − 4).'};
        if (inst.mode==='expand' && /[()]/.test(raw.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g,''))) return {ok:false, note:'Rätt värde, men utveckla helt, utan parenteser.'};
        if (inst.mode==='simplify' && /\//.test(raw)) return {ok:false, note:'Rätt värde, men förenkla bort bråkstrecket.'};
        if (inst.mode==='power'){ const okForm = r.t==='var' || r.t==='num' || (r.t==='^' && unpar(r.a).t==='var' && !hasVar(r.b)); if (!okForm) return {ok:false, note:'Rätt värde, men skriv det som en enda potens, till exempel a^8.'}; }
        return {ok:true};
      }
    }
  }catch(e){ return {invalid:true}; }
  return {invalid:true};
}

// ---------- FSRS-5 med standardparametrar ----------
const W = [0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
const DECAY = -0.5, FACTOR = 19/81;
const clampD = d => Math.min(10, Math.max(1, d));
const retr = (t,S) => Math.pow(1 + FACTOR*t/S, DECAY);
const ivlDays = (S, r) => S/FACTOR*(Math.pow(r, 1/DECAY) - 1);
const D0 = g => clampD(W[4] - Math.exp(W[5]*(g-1)) + 1);
const nextD = (D,g) => { const dp = D - W[6]*(g-3); return clampD(W[7]*D0(4) + (1-W[7])*(D + (dp-D)*(10-D)/9)); };
const recallS = (D,S,r,g) => S*(1 + Math.exp(W[8])*(11-D)*Math.pow(S,-W[9])*(Math.exp(W[10]*(1-r))-1)*(g===2?W[15]:1)*(g===4?W[16]:1));
const forgetS = (D,S,r) => Math.min(S, W[11]*Math.pow(D,-W[12])*(Math.pow(S+1,W[13])-1)*Math.exp(W[14]*(1-r)));
const shortS = (S,g) => S*Math.exp(W[17]*(g-3+W[18]));
function schedule(c, g, now, ret){
  c = Object.assign({st:'new', S:0, D:0, due:now, last:0, reps:0, lapses:0}, c||{});
  const toReview = () => { const days = Math.min(365, Math.max(1, Math.round(ivlDays(c.S, ret) * (1 + (Math.random()-0.5)*0.1)))); c.st='review'; c.due = now + days*DAY; };
  if (c.st==='new'){
    c.S = W[g-1]; c.D = D0(g);
    if (g===1){ c.st='learn'; c.due = now + 60e3; } else if (g===2){ c.st='learn'; c.due = now + 5*60e3; } else toReview();
  } else if (c.st==='learn' || c.st==='relearn'){
    c.S = shortS(c.S, g); c.D = nextD(c.D, g);
    if (g===1) c.due = now + 60e3; else if (g===2) c.due = now + 5*60e3; else toReview();
  } else {
    const t = Math.max(0, (now - c.last)/DAY), r = retr(t, c.S);
    if (g===1){ c.lapses++; c.S = forgetS(c.D, c.S, r); c.D = nextD(c.D, g); c.st='relearn'; c.due = now + 60e3; }
    else { c.S = recallS(c.D, c.S, r, g); c.D = nextD(c.D, g); toReview(); }
  }
  c.reps++; c.last = now;
  return c;
}

// ---------- Lagring: schemat i ett dokument, försöken i ett dokument per dag ----------
const LKEY = 'provpass-sr-v1';
const defSettings = () => ({active:Object.fromEntries(CATS.map(c=>[c.id,true])), newPerDay:15, passMode:'cards', passCards:20, passMin:5, retention:0.9, limits:{}, tol:{}, auto:true, updated:0});
const S = {state:{cards:{}, settings:defSettings(), newDays:{}}, log:[], mode:'local', db:null, uid:null, attached:false, loaded:false, stateTimer:null, logTimer:null, chain:Promise.resolve(), dirtyDays:new Set(), error:null};
function loadLocal(){
  try{ const raw = localStorage.getItem(LKEY); if (!raw) return; const o = JSON.parse(raw);
    if (o.state){ S.state.cards = o.state.cards||{}; S.state.newDays = o.state.newDays||{}; S.state.settings = Object.assign(defSettings(), o.state.settings||{}); S.state.settings.active = Object.assign(defSettings().active, (o.state.settings||{}).active||{}); }
    if (Array.isArray(o.log)) S.log = o.log;
  }catch(e){}
}
function saveLocal(){
  try{
    const cut = Date.now() - 30*DAY;
    const log = S.mode==='db' ? S.log.filter(a=>!a.s || a.t>cut) : S.log;
    localStorage.setItem(LKEY, JSON.stringify({state:S.state, log}));
  }catch(e){ S.error = 'Webbläsarens lagring är full. Exportera en säkerhetskopia.'; }
}
function mergeState(into, other){
  if (!other) return into;
  for (const [id,c] of Object.entries(other.cards||{})){ const mine = into.cards[id]; if (!mine || (c.last||0) > (mine.last||0)) into.cards[id] = c; }
  for (const [d,n] of Object.entries(other.newDays||{})) into.newDays[d] = Math.max(into.newDays[d]||0, n);
  if (other.settings && (other.settings.updated||0) > (into.settings.updated||0)){ into.settings = Object.assign(defSettings(), other.settings); into.settings.active = Object.assign(defSettings().active, other.settings.active||{}); }
  return into;
}
function mergeLog(list){ const have = new Map(S.log.map(a=>[a.id,a])); for (const a of list){ const m = have.get(a.id); if (!m) { have.set(a.id, a); } else if (a.s) m.s = 1; } S.log = [...have.values()].sort((a,b)=>a.t-b.t); }
const stateRef = () => S.db.doc('data/users/'+S.uid+'/sr-state');
const dayRef = (day, c) => S.db.doc('data/users/'+S.uid+'/srlog-'+day+'-'+c);
async function attach(db, uid){
  if (S.attached) return; S.attached = true;
  if (!db || !uid){ S.mode='local'; S.loaded=true; rerender(); return; }
  S.db = db; S.uid = uid;
  try{
    const timeout = new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),10000));
    const snap = await Promise.race([stateRef().get(), timeout]);
    if (snap.exists) mergeState(S.state, JSON.parse(JSON.stringify(snap.data())));
    const q = await Promise.race([db.collection('data/users/'+uid).where('kind','==','srlog').get(), timeout]);
    for (const d of q.docs){ const body = d.data(); if (Array.isArray(body.attempts)) mergeLog(body.attempts.map(a=>Object.assign({}, a, {s:1}))); }
    S.mode='db'; S.loaded=true;
    for (const a of S.log) if (!a.s) S.dirtyDays.add(a.day+'|'+a.c);
    saveLocal(); queueState(0); if (S.dirtyDays.size) queueLog(0);
  }catch(e){ S.mode='local'; S.loaded=true; S.error = 'Kontot svarar inte. Snabbräkningen sparas i webbläsaren tills vidare.'; }
  rerender();
}
function queueState(ms=1200){
  saveLocal();
  if (S.mode!=='db') return;
  clearTimeout(S.stateTimer);
  S.stateTimer = setTimeout(()=>{ S.chain = S.chain.then(async()=>{
    const snap = await stateRef().get();
    if (snap.exists) mergeState(S.state, JSON.parse(JSON.stringify(snap.data())));
    await stateRef().set(JSON.parse(JSON.stringify(S.state)));
  }).catch(()=>{ S.error = 'Kunde inte spara i kontot just nu. Försöker igen vid nästa svar.'; rerenderStatus(); }); }, ms);
}
function queueLog(ms=1500){
  saveLocal();
  if (S.mode!=='db') return;
  clearTimeout(S.logTimer);
  S.logTimer = setTimeout(()=>{ const days = [...S.dirtyDays]; S.dirtyDays.clear(); S.chain = S.chain.then(async()=>{
    for (const key of days){
      const [day, c] = key.split('|');
      const ref = dayRef(day, c), snap = await ref.get();
      const theirs = snap.exists && Array.isArray(snap.data().attempts) ? snap.data().attempts : [];
      const mine = S.log.filter(a=>a.day===day && String(a.c)===c);
      const all = new Map(); for (const a of theirs) all.set(a.id, a); for (const a of mine){ const {s, ...rest} = a; all.set(a.id, rest); }
      await ref.set({kind:'srlog', day, chunk:+c, attempts:[...all.values()].sort((a,b)=>a.t-b.t)});
      mine.forEach(a=>a.s=1);
    }
    saveLocal(); S.error = null;
  }).catch(()=>{ days.forEach(d=>S.dirtyDays.add(d)); S.error = 'Kunde inte spara historiken i kontot just nu. Försöker igen vid nästa svar.'; rerenderStatus(); }); }, ms);
}
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='hidden' && S.mode==='db'){ if (S.stateTimer){ queueState(0); } if (S.dirtyDays.size) queueLog(0); } });

// ---------- Kö och pass ----------
const set = () => S.state.settings;
const limitsOf = catId => set().limits[catId] || CATBY[catId].limits;
const tolOf = card => card.tpl && card.tol!=null ? (set().tol[card.id] ?? card.tol) : null;
const activeCards = () => CATS.filter(c=>set().active[c.id]).flatMap(c=>c.cards);
function dueList(){ const end = endOfToday(); return activeCards().filter(k=>{ const c=S.state.cards[k.id]; return c && c.st!=='new' && c.due<=end; }).sort((a,b)=>S.state.cards[a.id].due - S.state.cards[b.id].due); }
function newList(){
  const per = CATS.filter(c=>set().active[c.id]).map(c=>c.cards.filter(k=>!S.state.cards[k.id]));
  const out = []; let i = 0;
  while (per.some(l=>l.length)){ const l = per[i % per.length]; if (l.length) out.push(l.shift()); i++; }
  return out;
}
const newToday = () => S.state.newDays[dayKey()] || 0;
function makeInst(card){
  const base = card.tpl ? card.gen() : Object.assign({}, card, {q: card.qf ? card.qf() : card.q});
  const inst = Object.assign({}, base, {id:card.id, cat:card.cat, tpl:!!card.tpl, tol: card.tpl ? tolOf(card) ?? base.tol : base.tol});
  if (inst.kind==='choice' && Math.random()<0.5){ inst.opts = inst.opts.slice().reverse(); inst.correct = 1 - inst.correct; }
  return inst;
}
let pass = null, view = 'today';
function startPass(extraNew=0){
  const due = dueList();
  const room = Math.max(0, set().newPerDay + extraNew - newToday());
  const fresh = newList().slice(0, room);
  const queue = [...due, ...fresh];
  if (!queue.length){ toast('Inga kort att repetera just nu.'); return; }
  pass = {queue, pending:[], done:[], start:Date.now(), extraNew, cur:null};
  view = 'pass'; nextCard();
}
function passOver(){
  const s = set();
  return s.passMode==='cards' ? pass.done.length >= s.passCards : (Date.now()-pass.start) >= s.passMin*60e3;
}
function nextCard(){
  if (passOver() || (!pass.queue.length && !pass.pending.length)){ pass.cur = null; view='summary'; rerender(); return; }
  const now = Date.now();
  pass.pending.sort((a,b)=>S.state.cards[a.id].due - S.state.cards[b.id].due);
  let card;
  if (pass.pending.length && S.state.cards[pass.pending[0].id].due <= now) card = pass.pending.shift();
  else if (pass.queue.length) card = pass.queue.shift();
  else card = pass.pending.shift();
  pass.cur = {card, inst:makeInst(card), shown:0, answered:null};
  rerender();
}
function answer(raw, display){
  const cur = pass.cur; if (!cur || cur.answered) return;
  const ms = Math.round(performance.now() - cur.shown);
  const res = check(cur.inst, raw);
  if (res.invalid){ toast('Svaret gick inte att tolka. Kontrollera skrivsättet.'); return; }
  const [easy, good] = limitsOf(cur.card.cat);
  const g = !res.ok ? 1 : ms < easy*1000 ? 4 : ms < good*1000 ? 3 : 2;
  const now = Date.now(), prev = S.state.cards[cur.card.id];
  if (!prev) S.state.newDays[dayKey()] = newToday() + 1;
  const next = schedule(prev, g, now, set().retention);
  S.state.cards[cur.card.id] = next;
  const count = S.log.filter(a=>a.day===dayKey(now)).length;
  const att = {id: now.toString(36)+Math.random().toString(36).slice(2,6), t:now, day:dayKey(now), c:Math.floor(count/700), cat:cur.card.cat, card:cur.card.id, q:cur.inst.q, a:display ?? String(raw), ans:cur.inst.show, ok:res.ok?1:0, ms, g, next:next.due};
  S.log.push(att);
  S.dirtyDays.add(att.day+'|'+att.c);
  queueState(); queueLog();
  cur.answered = {ok:res.ok, g, ms, note:res.note, mine: display ?? String(raw), next:next.due};
  pass.done.push(att);
  if (next.due - now < 20*60e3) pass.pending.push(cur.card);
  rerender();
  if (res.ok && g>=3 && set().auto){ const me = cur; setTimeout(()=>{ if (pass && pass.cur===me) nextCard(); }, 650); }
}

// ---------- Statistik och export ----------
const GRADE = {1:'Igen',2:'Svårt',3:'Bra',4:'Lätt'};
const median = a => { if (!a.length) return null; const s=a.slice().sort((x,y)=>x-y), m=Math.floor(s.length/2); return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };
const fmtS = ms => ms==null ? '–' : fmtN(Math.round(ms/100)/10)+' s';
function catStats(){
  const end = endOfToday();
  return CATS.map(c=>{
    const att = S.log.filter(a=>a.cat===c.id);
    const okT = att.filter(a=>a.ok).map(a=>a.ms);
    let learned=0, due=0, fresh=0;
    for (const k of c.cards){ const st=S.state.cards[k.id]; if (!st) fresh++; else { if (st.st==='review') learned++; if (st.due<=end) due++; } }
    return {c, n:att.length, ok:att.filter(a=>a.ok).length, med:median(okT), learned, due, fresh, total:c.cards.length};
  });
}
function weakest(){
  const by = {};
  for (const a of S.log){ (by[a.card] ||= []).push(a); }
  return Object.entries(by).filter(([,l])=>l.length>=2).map(([id,l])=>{
    const card = CARDS[id]; if (!card) return null;
    const lim = limitsOf(card.cat)[1]*1000, recent = l.slice(-8);
    const wrong = recent.filter(a=>!a.ok).length/recent.length;
    const med = median(recent.filter(a=>a.ok).map(a=>a.ms));
    const slow = med==null ? 1 : Math.min(1.5, med/lim);
    return {card, n:l.length, wrong, med, score: wrong*2 + slow*0.6 + (S.state.cards[id]?.lapses||0)*0.15};
  }).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,15);
}
const csvCell = v => { const s = v==null ? '' : String(v); return /[;"\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
const isoLocal = t => { const d=new Date(t); return dayKey(t)+' '+[d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':'); };
function csv(){
  const head = ['datum','kategori','kort-id','fråga','mitt svar','rätt svar','rätt/fel','svarstid (ms)','betyg','nästa repetition'];
  const rows = S.log.map(a=>[isoLocal(a.t), CATBY[a.cat]?.name||a.cat, a.card, a.q, a.a, a.ans, a.ok?'rätt':'fel', a.ms, GRADE[a.g], isoLocal(a.next)]);
  return '﻿'+[head, ...rows].map(r=>r.map(csvCell).join(';')).join('\r\n');
}
async function offerFile(filename, data, box){
  try{
    const dl = window.claude?.use ? await claude.use('downloads') : null;
    if (dl){ await dl.save({filename, data}); toast('Filen är sparad.'); return; }
  }catch(e){ if (e && e.code==='declined') return; }
  // Fristående app: dela-menyn på mobil (Spara i Filer, AirDrop …), annars en vanlig nedladdning.
  const type = /\.json$/i.test(filename) ? 'application/json' : /\.csv$/i.test(filename) ? 'text/csv' : 'text/plain';
  try{
    const file = new File([data], filename, {type});
    if (IS_MOBILE && navigator.canShare?.({files:[file]})){ await navigator.share({files:[file]}); return; }
    const url = URL.createObjectURL(file);
    const a = el('a',{href:url, download:filename}); document.body.append(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 10000);
    toast('Filen är sparad i Hämtade filer.'); return;
  }catch(e){ if (e && e.name==='AbortError') return; }
  put(box, el('p',{class:'note'},'Nedladdning fungerar inte här. Markera och kopiera texten i stället:'), el('textarea',{class:'copybox',readonly:true,'aria-label':filename}, typeof data==='string' ? data.replace(/^﻿/,'') : ''));
}
function backup(){
  return JSON.stringify({app:'provpass-hp', v:1, exported:new Date().toISOString(), snabbrakning:{state:S.state, log:S.log.map(({s,...r})=>r)}, gamlaProv:P}, null, 1);
}
async function restore(file, box){
  let o; try{ o = JSON.parse(await file.text()); }catch(e){ toast('Filen är inte en giltig säkerhetskopia.'); return; }
  if (o.app!=='provpass-hp' || !o.snabbrakning){ toast('Filen är inte en säkerhetskopia från Provpass HP.'); return; }
  const before = S.log.length;

<script>

async function pageText(doc, p){
  const page = await doc.getPage(p);
  const tc = await page.getTextContent();
  const items = tc.items.filter(i=>typeof i.str==='string' && i.str.trim()).map(i=>({s:i.str, x:i.transform[4], y:i.transform[5], w:i.width||0}));
  // rader i läsordning; textbitar som ligger kant i kant slås ihop ("20"+"25"+"-"+"10" → "2025-10")
  const lines = [];
  for (const it of items.slice().sort((a,b)=> Math.abs(a.y-b.y)>3 ? b.y-a.y : a.x-b.x)){
    const l = lines[lines.length-1];
    if (l && Math.abs(l.y-it.y)<=3) l.items.push(it); else lines.push({y:it.y, items:[it]});
  }
  for (const l of lines){
    l.items.sort((a,b)=>a.x-b.x);
    let s = ''; l.offs = [];
    l.items.forEach((it,i)=>{ const prev = l.items[i-1]; s += (prev && it.x - (prev.x+prev.w) > 1.5 ? ' ' : ''); l.offs.push({at:s.length, x:it.x}); s += it.s; });
    l.s = s;
  }
  return {items, lines, str: lines.map(l=>l.s).join('\n')};
}
function parseFacit(t, date){
  const head = t.lines.find(l=>/Provpass\s*\d/.test(l.s));
  if (!head) return 0;
  const topY = head.y;
  const cols = [];
  for (const m of head.s.matchAll(/Provpass\s*(\d)/g)){
    let x = null; for (const o of head.offs) if (o.at <= m.index) x = o.x;
    if (x!=null) cols.push({x, pass:+m[1]});
  }
  cols.sort((a,b)=>a.x-b.x);
  if (!cols.length) return 0;
  const toks = [];
  for (const it of t.items){ if (it.y >= topY-2) continue; for (const w of it.s.trim().split(/\s+/)) toks.push({w, x:it.x, y:it.y}); }
  toks.sort((a,b)=> Math.abs(a.y-b.y)>3 ? b.y-a.y : a.x-b.x);
  const out = {};
  const put = (n, L, x) => {
    let ci = -1; for (let i=0;i<cols.length;i++) if (cols[i].x <= x+30) ci = i;
    if (ci<0 || n<1 || n>40) return;
    const pass = cols[ci].pass; (out[pass] ||= Array(40).fill(null))[n-1] = L;
  };
  for (let i=0;i<toks.length;i++){
    const a = toks[i].w, m = a.match(/^(\d{1,2})([A-E])$/);
    if (m) { put(+m[1], m[2], toks[i].x); continue; }
    if (/^\d{1,2}$/.test(a) && toks[i+1] && /^[A-E]$/.test(toks[i+1].w) && Math.abs(toks[i+1].y-toks[i].y)<4){ put(+a, toks[i+1].w, toks[i].x); i++; }
  }
  let count = 0;
  for (const [pass, arr] of Object.entries(out)){ (LIB.facits[date] ||= {})[pass] = arr; count++; }
  return count;
}
async function findQuestionPages(doc){
  const qp = {};
  for (let p=2; p<=doc.numPages; p++){
    const t = await pageText(doc, p);
    for (const it of t.items){ const m = it.s.match(/^\s*(\d{1,2})\.(\s|$)/); if (m){ const n=+m[1]; if (n>=1 && n<=40 && !(n in qp)) qp[n]=p; } }
  }
  // behåll bara uppgifter vars sidor kommer i stigande ordning
  const out = {}; let last = 0;
  for (let n=1;n<=40;n++){ if (n in qp && qp[n] >= last){ out[n]=qp[n]; last=qp[n]; } }
  return out;
}
async function parseFile(f){
  const doc = await pdfjsLib.getDocument({data:new Uint8Array(f.buf.slice(0)), isEvalSupported:false, useSystemFonts:true}).promise;
  const t1 = await pageText(doc, 1);
  const date = (t1.str.match(/(\d{4}-\d{2}-\d{2})/)||[])[1];
  if (/Facit/i.test(t1.str) && !/Svarsh/i.test(t1.str)){
    const n = date ? parseFacit(t1, date) : 0;
    doc.destroy();
    if (!n) LIB.problems.push(`${f.name}: ser ut som ett facit men gick inte att läsa.`);
    return;
  }
  const pm = t1.str.match(/Provpass\s*(\d)/);
  if (!date || !pm){ LIB.problems.push(`${f.name}: hittade inget datum eller provpass på första sidan.`); doc.destroy(); return; }
  const kind = /Kvantitativ del|XYZ/.test(t1.str) ? 'k' : /Verbal del|ORD/.test(t1.str) ? 'v' : null;
  if (!kind){ LIB.problems.push(`${f.name}: kunde inte avgöra om passet är verbalt eller kvantitativt.`); doc.destroy(); return; }
  const key = date+'|'+pm[1];
  let qpage = {};
  if (KNOWN_PAGES[key]) KNOWN_PAGES[key].forEach((p,i)=>{ if (p<=doc.numPages) qpage[i+1]=p; });
  else qpage = await findQuestionPages(doc);
  if (LIB.tests[key]) LIB.tests[key].doc.destroy?.();
  LIB.tests[key] = {key, date, pass:+pm[1], kind, name:f.name, doc, pages:doc.numPages, qpage, facit:null};
}
function link(){
  for (const t of Object.values(LIB.tests)) t.facit = LIB.facits[t.date]?.[t.pass] || null;
}
async function ingest(list, persist){
  if (!window.pdfjsLib){ toast('PDF-läsaren kunde inte laddas. Ladda om sidan.'); return; }
  LIB.loading = true; LIB.problems = []; render();

    try{ await parseFile(f); if (persist) await idb.put(f.name, f.buf); }
    catch(e){ LIB.problems.push(`${f.name}: kunde inte öppnas som PDF.`); }
  }
  link(); LIB.loading = false; render();
}

const canvasCache = new Map();
async function renderPage(test, p, cssWidth){
  const w = Math.min(1600, Math.round(cssWidth * Math.min(2, window.devicePixelRatio||1)));
  const k = test.key+'|'+p+'|'+w;
  if (canvasCache.has(k)) return canvasCache.get(k);
  const page = await test.doc.getPage(p);
  const vp0 = page.getViewport({scale:1});
  const vp = page.getViewport({scale: w/vp0.width});
  const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
  if (canvasCache.size > 24) canvasCache.delete(canvasCache.keys().next().value);
  canvasCache.set(k, c);
  return c;
}
function pagesFor(test, n){
  const p = test.qpage[n]; if (!p) return [];
  const qpages = new Set(Object.values(test.qpage));
  return (p-1 >= 2 && !qpages.has(p-1)) ? [p-1, p] : [p];
}
function pageBox(test, p, cssWidth){
  const box = el('div',{class:'pg'}, el('span',{class:'busy'}, el('span',{class:'spin'}), 'Sidan ritas…'));
  renderPage(test, p, cssWidth).then(c=>{ const img = c.cloneNode(); img.getContext('2d').drawImage(c,0,0); img.setAttribute('aria-label',`Sida ${p} i provhäftet`); img.setAttribute('role','img'); put(box, img); }).catch(()=>put(box, 'Sidan kunde inte visas.'));
  return box;
}

let sampleFn = null, sampleImages = false;
(async()=>{ await null; try{ if (window.claude?.use){ sampleFn = await claude.use('sample'); if (sampleFn){ const l = await sampleFn.limits().catch(()=>null); sampleImages = !!l?.images; } } }catch(e){ sampleFn=null; } if (view!=='quiz') render(); })();
function sampleErr(e){
  const c = e && e.code;
  if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','images_unavailable'].includes(c)){ sampleFn=null; return 'Förklaringar från Claude är inte tillgängliga här.'; }
  if (c==='rate_limited') return 'För många förfrågningar just nu. Försök igen om en stund.';
  if (c==='session_expired') return 'Du behöver logga in igen.';
  if (c==='cancelled') return 'Avbrutet.';
  return 'Förklaringen kunde inte hämtas. Försök igen.';
}
async function pageBlobs(test, n){
  const out = [];
  for (const p of pagesFor(test, n)){
    const c = await renderPage(test, p, 900);
    out.push(await new Promise(r=>c.toBlob(r,'image/jpeg',0.85)));
  }
  return out.filter(Boolean);
}
async function explain(r, box){
  const test = LIB.tests[r.tk];
  if (!sampleFn || !sampleImages || !test){ box.textContent = !test ? 'Läs in provfilen för att få en förklaring.' : 'Förklaringar från Claude är inte tillgängliga här.'; return null; }
  put(box, el('span',{class:'busy'}, el('span',{class:'spin'}), 'Claude läser uppgiften…'));
  const prompt = `Du är en pedagogisk studiehandledare inför högskoleprovet. Bilderna visar sidor ur ett gammalt provhäfte (högskoleprovet ${test.date}, provpass ${test.pass}). Titta på uppgift ${r.n} (delprov ${r.sec}, ${SEC[r.sec].name}).
Enligt det officiella facit är rätt svar ${r.answer}. Elevens svar: ${r.chosen || 'inget svar'}.
Förklara på svenska, pedagogiskt och steg för steg, varför ${r.answer} är rätt${r.chosen && r.chosen!==r.answer ? ` och vad som gör ${r.chosen} fel` : ''}. Avsluta med ett kort tips för liknande uppgifter.
Facit gäller alltid: ifrågasätt det inte och föreslå inget annat svar. Om du inte kan läsa uppgiften tydligt på bilderna, skriv det i stället för att gissa. Högst cirka 200 ord, ingen markdown.`;
  try{
    const imgs = await pageBlobs(test, r.n);
    const res = await sampleFn(prompt, {images: imgs, onText:({text})=>{ box.textContent = text; }});
    return res.text;
  }catch(e){ box.textContent = (e && e.text) || sampleErr(e); return null; }
}

let view = 'home', session = null, tick = null, result = null;
function itemsFor(test, secFilter){
  const out = [];
  for (let n=1;n<=40;n++){
    if (!test.qpage[n]) continue;
    const sec = secOf(test.kind, n);
    if (secFilter && sec!==secFilter) continue;
    out.push({tk:test.key, n, sec, answer: test.facit ? test.facit[n-1] : null});
  }
  return out;
}
function startSession(items, label){
  if (!items.length){ toast('Det finns inga uppgifter att öva på här.'); return; }
  const now = Date.now();
  session = {label, items, chosen:{}, times:{}, cur:0, start:now, last:now, deadline: now + TIME_LIMIT};
  view='quiz'; render(); window.scrollTo(0,0);
  clearInterval(tick); tick = setInterval(onTick, 1000);
}
function accrue(){ const s=session, now=Date.now(); s.times[s.cur]=(s.times[s.cur]||0)+(now-s.last); s.last=now; }
function goTo(i){ const s=session; if (i<0||i>=s.items.length||i===s.cur) return; accrue(); s.cur=i; renderQuiz(); window.scrollTo({top:0}); }
function pick(L){ const s=session; if (s.chosen[s.cur]===L) delete s.chosen[s.cur]; else s.chosen[s.cur]=L; renderSide(); }
function onTick(){
  if (view!=='quiz' || !session) return;
  const left = session.deadline - Date.now();
  const c = $('#clock'); if (c){ c.querySelector('.big').textContent = fmtTime(left); c.classList.toggle('low', left < 5*60*1000); }
  const q = $('#qtime'); if (q) q.textContent = 'Tid på uppgiften: ' + fmtTime((session.times[session.cur]||0) + (Date.now()-session.last));
  if (left <= 0){ toast('Tiden är slut. Passet har lämnats in.'); submit(); }
}
function submit(){
  const s = session; if (!s) return;
  accrue(); clearInterval(tick);
  const rows = s.items.map((it,i)=>{
    const chosen = s.chosen[i] || null, ms = s.times[i] || 0, pace = SEC[it.sec].pace*1000;
    const status = !it.answer ? 'nofacit' : !chosen ? 'blank' : chosen===it.answer ? 'ok' : 'bad';
    let tag = null;
    if (status==='bad' || status==='blank') tag = ms < 3000 && status==='blank' ? 'skipped' : ms < 0.5*pace ? 'fast' : ms > 1.5*pace ? 'slow' : 'norm';
    return Object.assign({}, it, {chosen, ms, status, tag, pace});
  });
  const graded = rows.filter(r=>r.status!=='nofacit');
  const correct = graded.filter(r=>r.status==='ok').length;
  const used = Math.min(TIME_LIMIT, Date.now()-s.start);
  // spara statistik, pass och alla felsvar
  const bySec = {};
  for (const r of graded){
    const st = P.stats[r.sec] || (P.stats[r.sec] = {n:0,c:0,ms:0,fast:0,slow:0});
    st.n++; if (r.status==='ok') st.c++; st.ms += r.ms;
    if (r.tag==='fast') st.fast=(st.fast||0)+1; if (r.tag==='slow') st.slow=(st.slow||0)+1;
    const b = bySec[r.sec] || (bySec[r.sec] = {n:0,c:0}); b.n++; if (r.status==='ok') b.c++;
    const key = r.tk+'|'+r.n, at = P.mistakes.findIndex(m=>m.key===key);
    if (r.status==='bad' || r.status==='blank'){
      const rec = {key, tk:r.tk, n:r.n, sec:r.sec, chosen:r.chosen, answer:r.answer, ms:r.ms, tag:r.tag, d:new Date().toISOString(), fixed:false, times:(at>=0?(P.mistakes[at].times||1)+1:1), ex: at>=0 ? P.mistakes[at].ex : null};
      if (at>=0) P.mistakes.splice(at,1);
      P.mistakes.unshift(rec);
    } else if (r.status==='ok' && at>=0){ P.mistakes[at].fixed = true; P.mistakes[at].fixedD = new Date().toISOString(); }
  }
  P.mistakes = P.mistakes.slice(0, 800);
  if (graded.length) P.sessions.unshift({d:new Date().toISOString(), label:s.label, tk:s.tk||null, sec:s.sec||null, n:graded.length, c:correct, ms:used, bySec});
  P.sessions = P.sessions.slice(0,60);
  store.save();
  result = {label:s.label, rows, correct, graded:graded.length, used, nofacit: rows.filter(r=>r.status==='nofacit')};
  session = null; view='result'; render(); window.scrollTo(0,0);
  autoExplain();
}

// ---------- Mönster i felen ----------
function analyse(rows){
  const wrong = rows.filter(r=>r.status==='bad'||r.status==='blank');
  const fast = wrong.filter(r=>r.tag==='fast'), slow = wrong.filter(r=>r.tag==='slow'), skipped = wrong.filter(r=>r.tag==='skipped');
  const okRows = rows.filter(r=>r.status==='ok');
  const out = [];
  if (!wrong.length) out.push('Inga fel i det här passet. Bra jobbat!');
  if (fast.length) out.push(`${fast.length} fel gjordes på mindre än halva riktmärkestiden (${fast.map(r=>r.sec+' '+r.n).join(', ')}). Där finns risk för slarvfel: läs frågan en gång till och kontrollera svaret innan du går vidare.`);
  if (slow.length) out.push(`${slow.length} fel tog mer än 1,5 gånger riktmärket (${slow.map(r=>r.sec+' '+r.n).join(', ')}). Där finns risk för en kunskapslucka: repetera grunderna för de här uppgiftstyperna.`);
  if (skipped.length) out.push(`${skipped.length} ${skipped.length===1?'uppgift lämnades obesvarad':'uppgifter lämnades obesvarade'} utan att du hann titta på dem. Det blir inget minusavdrag för fel svar, så gissa hellre än att lämna tomt.`);
  const bySec = {};
  for (const r of rows.filter(r=>r.status!=='nofacit')){ const b = bySec[r.sec] || (bySec[r.sec]={sec:r.sec,n:0,c:0,ms:0,fast:0,slow:0,pace:r.pace}); b.n++; b.ms+=r.ms; if (r.status==='ok') b.c++; if (r.tag==='fast') b.fast++; if (r.tag==='slow') b.slow++; }
  const secs = Object.values(bySec);
  const worst = secs.filter(b=>b.n>=3).sort((a,b)=>a.c/a.n-b.c/b.n)[0];
  if (worst && worst.c < worst.n) out.push(`Svagast i det här passet: ${worst.sec} (${worst.c} av ${worst.n} rätt).`);
  for (const b of secs){
    if (b.fast>=2 && b.fast>=b.slow) out.push(`I ${b.sec} dominerar snabba fel. Du har troligen tid att sakta ner där.`);
    else if (b.slow>=2) out.push(`I ${b.sec} tar felen lång tid. Det tyder mer på att något moment behöver övas än på slarv.`);
  }
  if (okRows.length && wrong.length){
    const avg = a => a.reduce((s,r)=>s+r.ms/r.pace,0)/a.length;
    const ro = avg(okRows), rw = avg(wrong.filter(r=>r.tag!=='skipped')) || 0;
    if (rw && rw < ro*0.7) out.push('Dina fel gick i snitt klart snabbare än dina rätta svar. Det pekar mot slarv snarare än okunskap.');
    if (rw && rw > ro*1.4) out.push('Dina fel tog i snitt klart längre tid än dina rätta svar. Det pekar mot kunskapsluckor snarare än slarv.');
  }
  return {out, secs};
}

      : 'Välj provhäften och facit som PDF-filer, till exempel från appen Filer eller iCloud Drive. Du kan markera flera filer på en gång. Filerna öppnas bara här på enheten och sparas till nästa gång. Inget skickas iväg.'),
    el('div',{class:'row'},
      CAN_PICK_DIR ? el('label',{class:'btn primary filebtn'}, 'Välj mapp', el('input',{type:'file',id:'pick-dir',webkitdirectory:true,multiple:true,onchange:e=>onPick(e.target.files)})) : null,
      el('label',{class:CAN_PICK_DIR?'btn filebtn':'btn primary filebtn'}, 'Välj PDF-filer', el('input',{type:'file',id:'pick-files',accept:'application/pdf,.pdf',multiple:true,onchange:e=>onPick(e.target.files)})),
      tests.length ? el('button',{class:'link',type:'button',onclick:async()=>{ await idb.clear(); for (const t of Object.values(LIB.tests)) t.doc.destroy?.(); LIB.tests={}; LIB.facits={}; render(); toast('Filerna är borttagna från webbläsaren.'); }},'Glöm filerna') : null),
    LIB.loading ? el('div',{class:'busy'}, el('span',{class:'spin'}), 'Läser in filerna…') : null,
    LIB.problems.length ? el('ul',{class:'problems'}, LIB.problems.map(p=>el('li',{},p))) : null);
  drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', ()=>drop.classList.remove('over'));
  drop.addEventListener('drop', e=>{ e.preventDefault(); drop.classList.remove('over'); onPick(e.dataTransfer.files); });

  const byDate = {};
  for (const t of tests) (byDate[t.date] ||= []).push(t);
  const doneBest = key => { let best=null; for (const s of P.sessions) if (s.tk===key && (!best || s.c/s.n > best.c/best.n)) best=s; return best; };
  const orphanFacit = Object.entries(LIB.facits).flatMap(([d,ps])=>Object.keys(ps).filter(p=>!LIB.tests[d+'|'+p]).map(p=>`${d} provpass ${p}`));
  const lib = tests.length ? el('section',{class:'lib'},
    Object.entries(byDate).map(([date, ts])=>el('div',{class:'panel exam'},
      el('h3',{}, 'Högskoleprovet '+date, el('span',{class:'label'}, ts.length+' provpass')),
      el('div',{class:'passes'}, ts.map(t=>{
        const items = itemsFor(t);
        const secs = [...new Set(items.map(i=>i.sec))];
        const missingSecs = (t.kind==='v'?['ORD','LÄS','MEK','ELF']:['XYZ','KVA','NOG','DTK']).filter(c=>!secs.includes(c));
        const best = doneBest(t.key);
        const nf = items.filter(i=>!i.answer).length;
        return el('article',{class:'pass'},
          el('div',{class:'pass-head'}, el('strong',{}, `Provpass ${t.pass} · ${t.kind==='v'?'Verbal':'Kvantitativ'}`),
            t.facit ? el('span',{class:'chip okc'}, nf ? `Facit saknas för ${nf} uppg.` : 'Facit finns') : el('span',{class:'chip missing'},'Facit saknas')),
          el('span',{class:'note'}, `${items.length} uppgifter`+(missingSecs.length?` · ${missingSecs.join(', ')} finns inte i filen`:'')+(best?` · bästa: ${best.c}/${best.n}`:'')),
          !t.facit ? el('span',{class:'note'}, 'Utan facit kan passet inte rättas. Lägg till facit-filen för '+t.date+'.') : null,
          el('div',{class:'chips'},
            el('button',{class:'btn small primary',type:'button',onclick:()=>startPass(t)},'Hela passet, 55 min'),
            secs.map(c=>el('button',{class:'chip '+SEC[c].part,type:'button',title:SEC[c].name,onclick:()=>startSec(t,c)}, c))));
      })))),
    orphanFacit.length ? el('p',{class:'note'}, 'Facit finns men provhäftet saknas för: '+orphanFacit.join(', ')+'.') : null
  ) : null;

  const part = (p, title, sub) => el('section',{class:'part'},
    el('div',{class:'part-head'}, el('h3',{},title), el('span',{class:'label'},sub)),
    el('div',{class:'grid'}, CODES.filter(c=>SEC[c].part===p).map(c=>{
      const s=SEC[c], st=P.stats[c]||{n:0,c:0,ms:0};
      const avg = st.n ? st.ms/st.n : null;
      const avail = tests.filter(t=>t.facit && itemsFor(t,c).length);
      return el('article',{class:'card '+p},
        el('span',{class:'code'},c),
        el('h4',{},s.name),
        el('div',{class:'meter',role:'img','aria-label':st.n?`${pct(st.c,st.n)} procent rätt`:'Inte övat än'}, el('i',{style:`width:${pct(st.c,st.n)}%`})),
        el('div',{class:'stat'}, el('span',{}, st.n ? `${pct(st.c,st.n)} % rätt av ${st.n}` : 'Inte övat än'), el('span',{class:'mono'}, avg!=null ? `${fmtTime(avg)} / uppg` : `riktm. ${fmtTime(s.pace*1000)}`)),
        st.n ? el('div',{class:'stat'}, el('span',{}, `Snabba fel: ${st.fast||0}`), el('span',{}, `Långsamma fel: ${st.slow||0}`)) : null,
        el('div',{class:'acts'},
          el('button',{type:'button',disabled:!avail.length,onclick:()=>{ const t = leastPractised(avail, c); startSec(t, c); }}, avail.length ? `Öva ${c} (${avail.length} prov)` : (c==='ELF' && tests.length ? 'ELF finns inte i filerna' : 'Läs in prov först'))));
    })));

  const log = P.sessions.length
    ? el('div',{class:'tbl-wrap'}, el('table',{class:'log'}, el('thead',{}, el('tr',{}, el('th',{},'Datum'), el('th',{},'Pass'), el('th',{class:'n'},'Rätt'), el('th',{class:'n'},'Tid'))),
        el('tbody',{}, P.sessions.slice(0,10).map(x=>el('tr',{},
          el('td',{}, fmtDate(x.d)), el('td',{}, x.label), el('td',{class:'n'}, `${x.c}/${x.n}`), el('td',{class:'n'}, fmtTime(x.ms)))))))
    : el('p',{class:'empty'},'Dina pass hamnar här när du har gjort det första.');
  const tagCount = t => open.filter(m=>m.tag===t).length;
  const mist = el('div',{class:'panel'}, el('h3',{},'Sparade fel'),
    P.mistakes.length ? el('p',{class:'note'}, `${P.mistakes.length} felsvarade uppgifter sparade, varav ${open.length} inte har klarats än. Snabba fel (risk för slarv): ${tagCount('fast')}. Långsamma fel (risk för lucka): ${tagCount('slow')}.`) : el('p',{class:'empty'},'Alla uppgifter du svarar fel på sparas här.'),
    el('div',{class:'row'},
      el('button',{class:'btn primary small',type:'button',disabled:!openLoaded.length,onclick:()=>startSession(shuffle(openLoaded).slice(0,40).map(m=>({tk:m.tk,n:m.n,sec:m.sec,answer:LIB.tests[m.tk].facit?.[m.n-1]||null})),'Repetera fel')}, `Repetera fel (${openLoaded.length})`),
      P.mistakes.length ? el('button',{class:'btn ghost small',type:'button',onclick:()=>{ view='mistakes'; renderMistakes(); }},'Visa alla') : null),
    open.length && !openLoaded.length ? el('p',{class:'note'},'Läs in provfilerna för att kunna repetera.') : null);

  put(app, 
    el('section',{class:'intro'},
      el('div',{},
        el('h2',{}, total.n ? `${total.n} uppgifter rättade, ${pct(total.c,total.n)} % rätt` : 'Träna på riktiga gamla högskoleprov'),
        el('p',{}, 'Appen visar sidorna ur dina egna provhäften och rättar bara mot facit i samma mapp. Varje pass har 55 minuter, precis som på provet, och tiden mäts för varje uppgift. Efteråt får du en analys av dina fel, och alla fel sparas.')),
      el('div',{class:'panel countdown'},
        el('span',{class:'label'},'Provdag'),
        el('span',{class:'big mono'}, dl==null ? '–' : dl<0 ? 'Klart' : String(dl)),
        el('span',{class:'note'}, dl==null ? 'Ange datumet för ditt provtillfälle.' : dl<0 ? 'Datumet har passerat.' : dl===1?'dag kvar':'dagar kvar'),
        el('label',{for:'exam',class:'note'},'Datum för provet'),
        el('input',{id:'exam',type:'date',value:P.examDate||'',onchange:e=>{P.examDate=e.target.value; store.save(); render();}}))),
    drop, lib,
    part('v','Verbal del','ORD · LÄS · MEK · ELF'),
    part('k','Kvantitativ del','XYZ · KVA · NOG · DTK'),
    el('section',{class:'lower'}, el('div',{class:'panel'}, el('h3',{},'Senaste pass'), log), mist));
}
function leastPractised(tests, c){
  const count = t => P.sessions.filter(s=>s.tk===t.key && s.sec===c).length;
  const m = Math.min(...tests.map(count));
  return shuffle(tests.filter(t=>count(t)===m))[0];
}
function startPass(t){
  if (!t.facit) toast('Facit saknas för det här passet. Du kan göra det, men det kan inte rättas.');
  startSession(itemsFor(t), `${t.date} · provpass ${t.pass}`);
  if (session) session.tk = t.key;
}
function startSec(t, c){
  if (!t.facit) toast('Facit saknas för det här passet. Du kan göra det, men det kan inte rättas.');
  startSession(itemsFor(t, c), `${c} · ${t.date} pass ${t.pass}`);
  if (session){ session.tk = t.key; session.sec = c; }
}

function renderQuiz(){
  const s=session, it=s.items[s.cur], test=LIB.tests[it.tk], app=$('#app');
  const pages = pagesFor(test, it.n);
  const viewer = el('section',{class:'viewer'});
  const holder = el('div',{class:'pages'+(pages.length>1?' two':'')});
  const wide = Math.max(320, Math.min(1100, (document.querySelector('.wrap')?.clientWidth||900) - 360));
  let shown = pages.slice();
  const draw = () => { holder.className = 'pages'+(shown.length>1?' two':''); put(holder, ...shown.map(p=>pageBox(test, p, shown.length>1 ? wide/2 : wide))); pinfo.textContent = 'Sida '+shown.join(' och ')+' av '+test.pages; };
  const pinfo = el('span',{class:'note'});
  viewer.append(
    el('div',{class:'vbar'},
      el('span',{class:'label'}, `${test.date} · provpass ${test.pass}`),
      el('div',{class:'row'}, pinfo,
        el('button',{class:'btn ghost small',type:'button',onclick:()=>{ const f=shown[0]-1; if (f>=1){ shown=[f]; draw(); } }},'Föregående sida'),
        el('button',{class:'btn ghost small',type:'button',onclick:()=>{ const l=shown[shown.length-1]+1; if (l<=test.pages){ shown=[l]; draw(); } }},'Nästa sida'),
        el('button',{class:'link',type:'button',onclick:()=>{ shown=pages.slice(); draw(); }},'Tillbaka till uppgiften'))),
    holder);
  draw();
  const side = el('aside',{class:'side',id:'side'});
  put(app, el('div',{class:'qwrap'}, viewer, side));
  renderSide();
}
function renderSide(){
  const s=session, it=s.items[s.cur], sec=SEC[it.sec], side=$('#side'); if (!side) return;
  const left = s.deadline - Date.now();
  const opts = sec.opts;
  const sheet = el('div',{class:'sheetgrid'});
  let lastSec = null;
  s.items.forEach((x,i)=>{
    if (x.sec!==lastSec){ sheet.append(el('span',{class:'secsep'}, x.sec)); lastSec=x.sec; }
    sheet.append(el('button',{type:'button',class:[s.chosen[i]?'done':'', i===s.cur?'cur':'', x.answer?'':'nf'].join(' '),'aria-label':`Uppgift ${x.n}`+(s.chosen[i]?`, svar ${s.chosen[i]}`:', ej besvarad'),onclick:()=>goTo(i)}, String(x.n), el('span',{class:'a'}, s.chosen[i]||'')));
  });
  const answered = Object.keys(s.chosen).length;
  side.className = 'side '+(sec.part==='k'?'kq':'');
  put(side, 
    el('div',{class:'clock'+(left<5*60*1000?' low':''),id:'clock'}, el('span',{class:'label'},'Tid kvar'), el('span',{class:'big'}, fmtTime(left))),
    el('div',{class:'qhead'}, el('span',{class:'chip '+sec.part}, it.sec), el('strong',{}, `Uppgift ${it.n}`), el('span',{class:'note'}, `${s.cur+1} av ${s.items.length}`)),
    !it.answer ? el('span',{class:'chip missing'},'Facit saknas för den här uppgiften') : null,
    el('div',{class:'bubbles',role:'group','aria-label':'Ditt svar'}, LET.slice(0,opts).map(L=>el('button',{type:'button',class:'bub'+(s.chosen[s.cur]===L?' on':''),'aria-pressed':s.chosen[s.cur]===L?'true':'false',onclick:()=>pick(L)}, L))),
    el('span',{class:'qtime',id:'qtime'}, 'Tid på uppgiften: '+fmtTime((s.times[s.cur]||0)+(Date.now()-s.last))),
    el('div',{class:'row'},
      el('button',{class:'btn ghost small',type:'button',disabled:s.cur===0,onclick:()=>goTo(s.cur-1)},'Föregående'),
      el('button',{class:'btn primary small',type:'button',disabled:s.cur===s.items.length-1,onclick:()=>goTo(s.cur+1)},'Nästa')),
    el('button',{class:'link sheettoggle',type:'button',onclick:()=>$('#sheetwrap').classList.toggle('open')},'Visa svarshäftet'),
    el('div',{class:'sheetwrap',id:'sheetwrap'}, el('span',{class:'label'},`Svarshäfte · ${answered} av ${s.items.length} besvarade`), sheet),
    el('div',{class:'row'},
      el('button',{class:'btn small',type:'button',onclick:confirmSubmit,id:'submitbtn'},'Lämna in'),
      el('span',{class:'note',id:'confirm'})),
    el('div',{class:'row'},
      el('span',{class:'note'}, 'Tangenter: A–E svarar, ← → byter uppgift'),
      el('button',{class:'link',type:'button',onclick:abortSession,id:'abortbtn'},'Avbryt utan att rätta')));
}
function abortSession(){
  const b = $('#abortbtn');
  if (!b.dataset.armed){ b.dataset.armed='1'; b.textContent='Klicka igen för att avbryta. Inget sparas.'; return; }
  clearInterval(tick); session=null; view='home'; render();
}
function confirmSubmit(){
  const s=session, left = s.items.length - Object.keys(s.chosen).length;
  const btn = $('#submitbtn');
  if (btn.dataset.armed){ submit(); return; }
  btn.dataset.armed = '1'; btn.textContent = 'Ja, lämna in';
  $('#confirm').textContent = left ? `${left} uppgifter är obesvarade.` : 'Alla uppgifter är besvarade.';
}

function renderResult(){
  const r=result, app=$('#app');
  const {out, secs} = analyse(r.rows);
  let filter = 'wrong';
  const list = el('div',{class:'items'});
  const drawList = () => {
    const rows = r.rows.filter(x=> filter==='all' ? true : filter==='wrong' ? (x.status==='bad'||x.status==='blank') : x.status==='ok');
    put(list, ...rows.map(itemCard));
    if (!rows.length) list.append(el('p',{class:'empty'}, filter==='wrong' ? 'Inga fel att visa.' : 'Inget att visa.'));
  };
  const fb = (k, txt) => el('button',{type:'button',class:filter===k?'on':'',onclick:e=>{ filter=k; [...e.currentTarget.parentNode.children].forEach(b=>b.classList.remove('on')); e.currentTarget.classList.add('on'); drawList(); }}, txt);
  put(app, 
    el('section',{class:'result-top'},
      el('div',{class:'panel'},
        el('span',{class:'label'}, r.label),
        el('div',{class:'score mono'}, String(r.correct), el('small',{},` / ${r.graded}`)),
        el('p',{}, r.graded ? `${pct(r.correct,r.graded)} % rätt. Tid: ${fmtTime(r.used)} av 55:00.` : 'Inga uppgifter kunde rättas.'),
        r.nofacit.length ? el('p',{class:'chip missing'}, `Facit saknas för ${r.nofacit.length} uppgifter (${r.nofacit.map(x=>x.sec+' '+x.n).join(', ')}). De har inte rättats.`) : null,
        el('p',{class:'note'}, 'Alla fel och obesvarade uppgifter är sparade under "Sparade fel".'),
        el('div',{class:'row'}, el('button',{class:'btn primary',type:'button',onclick:()=>{view='home';render();}},'Till startsidan'))),
      el('div',{class:'panel'}, el('h3',{},'Per delprov'),
        el('div',{class:'tbl-wrap'}, el('table',{class:'log'},
          el('thead',{}, el('tr',{}, el('th',{},'Delprov'), el('th',{class:'n'},'Rätt'), el('th',{class:'n'},'Snitt / uppg'), el('th',{class:'n'},'Riktmärke'), el('th',{class:'n'},'Snabba fel'), el('th',{class:'n'},'Långsamma fel'))),
          el('tbody',{}, secs.map(b=>el('tr',{}, el('td',{}, b.sec), el('td',{class:'n'}, `${b.c}/${b.n}`), el('td',{class:'n'}, fmtTime(b.ms/b.n)), el('td',{class:'n'}, fmtTime(b.pace)), el('td',{class:'n'}, b.fast), el('td',{class:'n'}, b.slow)))))))),
    el('section',{class:'panel pattern'}, el('h3',{},'Mönster i felen'), el('ul',{class:'insights'}, out.map(t=>el('li',{},t))),
      el('p',{class:'note'}, 'Snabbt fel: mindre än halva riktmärket. Långsamt fel: mer än 1,5 gånger riktmärket. Riktmärket kommer från provhäftenas rekommenderade provtid per delprov.')),
    el('section',{}, el('div',{class:'part-head',style:'margin-top:28px'}, el('h3',{},'Rättning'),
      el('div',{class:'filters'}, fb('wrong','Fel'), fb('ok','Rätt'), fb('all','Alla'))), list));
  drawList();
}
function itemCard(x){
  const test = LIB.tests[x.tk];
  const key = x.tk+'|'+x.n;
  const box = el('div',{class:'expl',hidden:true,'aria-live':'polite'});
  const saved = P.mistakes.find(m=>m.key===key)?.ex || x.ex;
  if (saved){ box.hidden=false; put(box, el('span',{class:'src'},'Claudes förklaring av facitsvaret'), saved); }
  x._box = box;
  const st = {ok:['ok','Rätt'], bad:['bad','Fel'], blank:['bad','Obesvarad'], nofacit:['nf','Facit saknas']}[x.status];
  const thumbWrap = el('div',{class:'thumb',hidden:true});
  return el('article',{class:'item'+(x.status==='bad'||x.status==='blank'?' bad':'')},
    el('div',{class:'item-head'},
      el('span',{class:'chip '+SEC[x.sec].part}, x.sec), el('strong',{}, `Uppgift ${x.n}`),
      el('span',{class:'tag '+st[0]}, st[1]),
      x.tag ? el('span',{class:'tag '+(x.tag==='skipped'?'norm':x.tag)}, TAGTXT[x.tag]) : null,
      el('span',{class:'note mono'}, `Ditt svar: ${x.chosen||'–'} · Facit: ${x.answer||'saknas'} · ${fmtTime(x.ms)} (riktm. ${fmtTime(x.pace)})`)),
    el('div',{class:'row'},
      test ? el('button',{class:'btn ghost small',type:'button',onclick:e=>{ thumbWrap.hidden=!thumbWrap.hidden; if(!thumbWrap.hidden && !thumbWrap.childNodes.length) thumbWrap.append(...pagesFor(test,x.n).map(p=>pageBox(test,p,520))); e.currentTarget.textContent = thumbWrap.hidden?'Visa uppgiften':'Dölj uppgiften'; }},'Visa uppgiften') : null,
      x.answer && sampleFn && sampleImages ? el('button',{class:'btn ghost small',type:'button',onclick:async()=>{ box.hidden=false; const t = await explain(x, box); if (t){ x.ex=t; saveEx(key,t); box.prepend(el('span',{class:'src'},'Claudes förklaring av facitsvaret')); } }}, saved?'Förklara igen':'Förklara') : null),
    thumbWrap, box);
}
function saveEx(key, text){ const m = P.mistakes.find(m=>m.key===key); if (m){ m.ex = text; store.save(); } }
async function autoExplain(){
  if (!sampleFn || !sampleImages || !result) return;
  const r = result;
  for (const x of r.rows.filter(x=>(x.status==='bad'||x.status==='blank') && x.answer)){
    if (result!==r || view!=='result' || !sampleFn) return;
    if (P.mistakes.find(m=>m.key===x.tk+'|'+x.n)?.ex || x.ex) continue;
    const box = x._box; if (!box || !box.isConnected) continue;
    box.hidden=false;
    const t = await explain(x, box);
    if (t){ x.ex=t; saveEx(x.tk+'|'+x.n, t); box.prepend(el('span',{class:'src'},'Claudes förklaring av facitsvaret')); }
    else return;
  }
}
function renderMistakes(){
  const app=$('#app');
  const rows = P.mistakes.map(m=>({tk:m.tk, n:m.n, sec:m.sec, chosen:m.chosen, answer:m.answer, ms:m.ms, tag:m.tag, status:m.chosen?'bad':'blank', pace:SEC[m.sec].pace*1000, ex:m.ex, fixed:m.fixed, times:m.times, d:m.d}));
  put(app, 
    el('div',{class:'part-head',style:'margin-top:24px'}, el('h3',{},`Sparade fel (${rows.length})`), el('button',{class:'btn ghost small',type:'button',onclick:()=>{view='home';render();}},'Till startsidan')),
    el('div',{class:'items'}, rows.map(x=>{ const c = itemCard(x); c.querySelector('.item-head').append(el('span',{class:'note'}, `${x.tk.replace('|',' · pass ')} · fel ${x.times||1} gång${(x.times||1)>1?'er':''}`+(x.fixed?' · klarad senare':''))); return c; })));
}

document.addEventListener('keydown', e=>{
  if (tab!=='prov' || view!=='quiz' || !session || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const k = e.key.toUpperCase(), opts = SEC[session.items[session.cur].sec].opts;
  const pos = LET.indexOf(k);
  if (pos>=0 && pos<opts){ e.preventDefault(); pick(k); }
  else if (e.key==='ArrowRight'){ e.preventDefault(); goTo(session.cur+1); }
  else if (e.key==='ArrowLeft'){ e.preventDefault(); goTo(session.cur-1); }
});
$('#home-btn').addEventListener('click', ()=>{
  if (tab==='sr'){ setTab('prov'); return; }
  if (view==='quiz' && session){ toast('Lämna in passet först, eller vänta tills tiden tar slut.'); return; }
  view='home'; render();
});
$('#tab-prov').addEventListener('click', ()=>setTab('prov'));
$('#tab-sr').addEventListener('click', ()=>setTab('sr'));
try{ const t = location.hash==='#snabbrakning' ? 'sr' : localStorage.getItem('provpass-tab'); if (t==='sr'){ tab='prov'; setTab('sr'); } }catch(e){}

render();
store.init();
(async()=>{ const saved = await idb.all(); if (saved.length) await ingest(saved, false); })();
</script>
