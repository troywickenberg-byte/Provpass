function timePanel(rows){
  const W=640, H=200, L=34, R=8, T=14, B=30, n=rows.length, bw=(W-L-R)/Math.max(n,1);
  const max = Math.max(...rows.map(r=>r.ms), ...rows.map(r=>r.pace*1.6), 1);
  const y = v => T + (1-v/max)*(H-T-B);
  const svg = [`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Tid per uppgift jämfört med riktmärket">`];
  const paceY = y(rows[0]?.pace||0);
  rows.forEach((r,i)=>{ const c = r.status==='nofacit' ? 'nf' : taskColor(r.status==='ok', r.ms, r.pace), x = L+i*bw;
    svg.push(`<rect x="${x+bw*0.15}" y="${y(r.ms)}" width="${bw*0.7}" height="${Math.max(1,y(0)-y(r.ms))}" rx="2" class="bar ${c}"/>`);
    if (n<=20 || i%2===0) svg.push(`<text x="${x+bw/2}" y="${H-B+16}" text-anchor="middle" class="ax">${i+1}</text>`); });
  svg.push(`<line x1="${L}" x2="${W-R}" y1="${paceY}" y2="${paceY}" class="goal"/><text x="${W-R}" y="${paceY-5}" text-anchor="end" class="goaltxt">Riktmärke ${fmtTime(rows[0]?.pace||0)}</text>`);
  svg.push(`<text x="${L-6}" y="${y(max)+10}" text-anchor="end" class="ax">${Math.round(max/1000)} s</text></svg>`);
  const d = el('div',{class:'chartwrap'}); d.innerHTML = svg.join('');
  const cnt = c => rows.filter(r=>r.status!=='nofacit' && taskColor(r.status==='ok', r.ms, r.pace)===c).length;
  return el('section',{class:'panel'}, el('h3',{}, 'Tid per uppgift'),
    el('p',{class:'note'}, `Grön: rätt i tid (${cnt('green')}). Orange: rätt men mer än 1,5 × riktmärket (${cnt('orange')}). Röd: fel eller obesvarad (${cnt('red')}).`), d);
}

    el('div',{class:'row'},
      test ? el('button',{class:'btn ghost small',type:'button',onclick:e=>{ thumbWrap.hidden=!thumbWrap.hidden; if(!thumbWrap.hidden && !thumbWrap.childNodes.length) thumbWrap.append(...taskBoxes(test, x.n, pagesFor(test,x.n), 520)); e.currentTarget.textContent = thumbWrap.hidden?'Visa uppgiften':'Dölj uppgiften'; }},'Visa uppgiften') : null,
      x.answer && sampleFn && sampleImages ? el('button',{class:'btn ghost small',type:'button',onclick:async()=>{ box.hidden=false; const t = await explain(x, box); if (t){ x.ex=t; saveEx(key,t); box.prepend(el('span',{class:'src'},'Claudes förklaring av facitsvaret')); } }}, saved?'Förklara igen':'Förklara') : null),
    errBox, thumbWrap, box);
}
function saveEx(key, text){ const m = P.mistakes.find(m=>m.key===key); if (m){ m.ex = text; store.save(); } }
async function autoExplain(){
  if (!sampleFn || !sampleImages || !result) return;
  const r = result;
  for (const x of r.rows.filter(x=>(x.status==='bad'||x.status==='blank') && x.answer)){
    if (result!==r || view!=='result' || !sampleFn) return;
    if (P.mistakes.find(m=>m.key===x.tk+'|'+x.n)?.ex || x.ex) continue;
    const box = x._box; if (!box || !box.isConnected) continue;
    box.hidden=false;
    const t = await explain(x, box);
    if (t){ x.ex=t; saveEx(x.tk+'|'+x.n, t); box.prepend(el('span',{class:'src'},'Claudes förklaring av facitsvaret')); }
    else return;
  }
}
function renderMistakes(){
  const app=$('#app');
  const rows = P.mistakes.map(m=>({tk:m.tk, n:m.n, sec:m.sec, chosen:m.chosen, answer:m.answer, ms:m.ms, tag:m.tag, status:m.chosen?'bad':'blank', pace:SEC[m.sec].pace*1000, ex:m.ex, fixed:m.fixed, times:m.times, d:m.d}));
  put(app, 
    el('div',{class:'part-head',style:'margin-top:24px'}, el('h3',{},`Sparade fel (${rows.length})`), el('button',{class:'btn ghost small',type:'button',onclick:()=>{view='home';render();}},'Till startsidan')),
    el('div',{class:'items'}, rows.map(x=>{ const c = itemCard(x); c.querySelector('.item-head').append(el('span',{class:'note'}, `${examShort(x.tk.split('|')[0])} · pass ${x.tk.split('|')[1]} · fel ${x.times||1} gång${(x.times||1)>1?'er':''}`+(x.fixed?' · klarad senare':''))); return c; })));
}

document.addEventListener('keydown', e=>{
  if (tab!=='prov' || view!=='quiz' || !session || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const k = e.key.toUpperCase(), opts = SEC[session.items[session.cur].sec].opts;
  const pos = LET.indexOf(k);
  if (pos>=0 && pos<opts){ e.preventDefault(); pick(k); }
  else if (e.key==='ArrowRight'){ e.preventDefault(); goTo(session.cur+1); }
  else if (e.key==='ArrowLeft'){ e.preventDefault(); goTo(session.cur-1); }
});
$('#home-btn').addEventListener('click', ()=>{
  if (view==='quiz' && session){ toast('Lämna in passet först, eller vänta tills tiden tar slut.'); return; }
  if (tab!=='prov'){ setTab('prov'); return; }
  view='home'; render();
});
for (const [id,name] of TABS) $('#'+id).addEventListener('click', ()=>setTab(name));
try{ let t = location.hash==='#snabbrakning' ? 'hr' : localStorage.getItem('provpass-tab'); if (t==='sr') t='hr'; if (['rt','hr','fr'].includes(t)){ tab='prov'; setTab(t); } }catch(e){}

render();
store.init();
(async()=>{ const saved = await idb.all(); if (saved.length) await ingest(saved, false); })();
</script>
