<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Provpass HP</title>
<meta name="description" content="Öva på högskoleprovet: gamla provpass, digital svarsblankett och snabbräkning.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#F3F0FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15121F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Provpass HP">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="fonts/fonts.css">
</head><body>
<style>
/* Layout: "svarsblankett" — a ruled header strip, then the provpass library, or the original test page beside a digital answer sheet. */
/* D-designen "Mjuk & vänlig": lila huvudfärg, grönt = verbal del, orange = kvantitativ del. */
:root{
  --paper:#F3F0FA; --sheet:#FFFFFF; --ink:#1E1838; --soft:#5E5878; --line:#E2DCF2;
  --form:#0F6B50; --form-tint:#E4F3EC; --quant:#A2470F; --quant-tint:#FDEBDD;
  --ok:#0F7A5C; --ok-tint:#E4F3EC; --bad:#B42318; --bad-tint:#FDE8E6; --warn:#8A5A00; --warn-tint:#FBF0D9; --graphite:#5B3FD9;
  --accent:#5B3FD9; --accent-tint:#ECE8F7; --accent-ink:#5B3FD9;
  --f-display:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-body:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --r:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15121F; --sheet:#221D33; --ink:#F1EEFA; --soft:#ABA4C4; --line:#3A3354;
  --form:#8FE0BC; --form-tint:#173A2E; --quant:#F7B98A; --quant-tint:#3F2817;
  --ok:#8FE0BC; --ok-tint:#173A2E; --bad:#FF9C92; --bad-tint:#3D1C1C; --warn:#F2C062; --warn-tint:#33280F; --graphite:#B9ABFF;
  --accent:#5B3FD9; --accent-tint:#322B4A; --accent-ink:#B9ABFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15121F; --sheet:#221D33; --ink:#F1EEFA; --soft:#ABA4C4; --line:#3A3354;
  --form:#8FE0BC; --form-tint:#173A2E; --quant:#F7B98A; --quant-tint:#3F2817;
  --ok:#8FE0BC; --ok-tint:#173A2E; --bad:#FF9C92; --bad-tint:#3D1C1C; --warn:#F2C062; --warn-tint:#33280F; --graphite:#B9ABFF;
  --accent:#5B3FD9; --accent-tint:#322B4A; --accent-ink:#B9ABFF; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--form);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.note{font-size:13px;color:var(--soft)}

.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-bottom:14px;border-bottom:2px solid var(--form);position:relative}
.mast::after{content:"";position:absolute;left:0;right:0;bottom:-7px;border-bottom:1px solid var(--form);opacity:.5}
.brand{display:flex;align-items:baseline;gap:12px;background:none;border:0;padding:0}
.brand h1{font-size:clamp(26px,4vw,34px);font-weight:800;letter-spacing:-.02em}
.brand .tag{font-family:var(--f-mono);font-size:12px;color:var(--form);border:1px solid var(--form);border-radius:4px;padding:1px 6px}
.status{font-size:13px;color:var(--soft);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--soft)}
.dot.on{background:var(--ok)}

.btn{border:1.5px solid var(--ink);background:var(--sheet);border-radius:999px;padding:9px 18px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:var(--line)}
.btn.small{padding:5px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:not(:disabled):hover{transform:translateY(-1px)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.link{background:none;border:0;padding:0;color:var(--soft);text-decoration:underline;text-underline-offset:3px;font-size:14px}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.panel h3{font-size:18px;margin-bottom:10px}

/* home */
.intro{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;margin:28px 0 8px}
.intro p{margin:6px 0 0;color:var(--soft);max-width:62ch}
.intro h2{font-size:clamp(22px,3vw,28px)}
.countdown{display:flex;flex-direction:column;gap:8px}
.countdown .big{font-family:var(--f-display);font-size:40px;font-weight:800;line-height:1}
.countdown input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.pdstats{display:grid;gap:12px;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.pdgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pdtile{display:grid;align-content:start;gap:2px;padding:10px 12px;border-radius:8px;background:var(--paper);border:1px solid var(--line)}
.pdtile b{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1.1}
.pdtile.time b{font-size:20px}
.pdtile.sr{border-color:var(--quant);background:var(--quant-tint)}
.pdtile.time:not(.sr){border-color:var(--form);background:var(--form-tint)}
.pdstats .catlist{margin-top:4px}

.drop{margin-top:24px;border:2px dashed var(--line);border-radius:var(--r);padding:22px;background:var(--sheet);display:grid;gap:10px;justify-items:start}
.drop.over{border-color:var(--form);background:var(--form-tint)}
.drop h3{font-size:20px}
.drop p{margin:0;color:var(--soft);max-width:65ch}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.problems{margin:0;padding-left:18px;color:var(--bad);font-size:14px}

.lib{margin-top:28px;display:grid;gap:16px}
.exam h3{font-size:20px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.exam h3 .label{font-size:11px}
.passes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.pass{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.pass-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.pass-head strong{font-family:var(--f-display);font-size:17px}
.chip{font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:4px;border:1px solid transparent;background:transparent}
.chip.v{background:var(--form-tint);color:var(--form)} .chip.k{background:var(--quant-tint);color:var(--quant)}
button.chip:hover{border-color:currentColor}
.chip.missing{background:var(--warn-tint);color:var(--warn)}
.chip.okc{background:var(--ok-tint);color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.part{margin-top:32px}
.part-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.part-head h3{font-size:20px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .code{font-family:var(--f-mono);font-weight:500;font-size:13px;padding:2px 8px;border-radius:4px;align-self:flex-start}
.v .code{background:var(--form-tint);color:var(--form)}
.k .code{background:var(--quant-tint);color:var(--quant)}
.card h4{margin:0;font-family:var(--f-display);font-size:17px;font-weight:700;line-height:1.2}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px}
.v .meter i{background:var(--form)} .k .meter i{background:var(--quant)}
.stat{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--soft)}
.card .acts{margin-top:auto}
.card .acts button{width:100%;border:1px solid var(--line);background:transparent;border-radius:6px;padding:7px 10px;text-align:left;font-size:14px}
.card .acts button:hover:not(:disabled){border-color:var(--ink)}
.card .acts button:disabled{opacity:.5;cursor:not-allowed}

.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:36px}
table.log{width:100%;border-collapse:collapse;font-size:14px}
table.log td,table.log th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.log th{font-weight:400;color:var(--soft);font-size:12px}
table.log td.n,table.log th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.empty{color:var(--soft);font-size:14px;margin:0}

/* quiz */
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;margin-top:20px;align-items:start}
.viewer{display:grid;gap:12px;min-width:0}
.vbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.pages{display:grid;gap:12px}
.pages.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.pg{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-height:200px;display:grid;place-items:center;color:#5A6275;font-size:14px}
.pg canvas{display:block;width:100%;height:auto}
.pg.crop{place-items:start center;padding:8px 0}
.pg.crop canvas{width:auto;max-width:100%}
.side{position:sticky;top:calc(12px + env(safe-area-inset-top,0px));background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px}
.clock{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.clock .big{font-family:var(--f-mono);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums}
.clock.low .big{color:var(--bad)}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qhead strong{font-family:var(--f-display);font-size:20px}
.bubbles{display:flex;gap:8px;flex-wrap:wrap}
.bub{width:46px;height:34px;border-radius:50%;border:2px solid var(--form);background:transparent;color:var(--form);font-family:var(--f-mono);font-size:15px;font-weight:500}
.kq .bub{border-color:var(--quant);color:var(--quant)}
.bub.on{background:var(--graphite);border-color:var(--graphite);color:var(--sheet)}
.qtime{font-size:13px;color:var(--soft)}
.sheetgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.sheetgrid button{border:1px solid var(--line);background:transparent;border-radius:4px;padding:3px 0;font-family:var(--f-mono);font-size:12px;line-height:1.2}
.sheetgrid button .a{display:block;font-size:11px;color:var(--soft);min-height:1.2em}
.sheetgrid button.done{background:var(--paper)}
.sheetgrid button.done .a{color:var(--ink);font-weight:500}
.sheetgrid button.cur{border-color:var(--ink);border-width:2px}
.sheetgrid button.nf{border-style:dashed}
.secsep{grid-column:1/-1;font-family:var(--f-mono);font-size:11px;color:var(--soft);margin-top:4px}

/* result */
.result-top{margin-top:24px;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:24px}
.score{font-family:var(--f-display);font-size:64px;font-weight:800;line-height:1}
.score small{font-size:24px;color:var(--soft);font-weight:500}
.pattern{margin-top:24px}
.insights{margin:0;padding-left:18px;display:grid;gap:8px}
.tag{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;white-space:nowrap}
.tag.fast{background:var(--warn-tint);color:var(--warn)}
.tag.slow{background:var(--form-tint);color:var(--form)}
.tag.norm{background:var(--paper);color:var(--soft);border:1px solid var(--line)}
.tag.ok{background:var(--ok-tint);color:var(--ok)}
.tag.bad{background:var(--bad-tint);color:var(--bad)}
.tag.nf{background:var(--warn-tint);color:var(--warn)}
.tbl-wrap{overflow-x:auto}
.items{display:grid;gap:10px;margin-top:24px}
.item{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.item.bad{border-left:4px solid var(--bad)}
.item-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.item-head strong{font-family:var(--f-display)}
.expl{font-size:15px;white-space:pre-wrap;background:var(--paper);border-radius:8px;padding:12px 14px;max-width:80ch}
.expl .src{display:block;font-size:12px;color:var(--soft);margin-bottom:6px;white-space:normal}
.thumb{max-width:520px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:14px}
.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
.busy{display:flex;gap:10px;align-items:center;color:var(--soft);font-size:14px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--form);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

@media (max-width:980px){.qwrap{grid-template-columns:minmax(0,1fr)}.side{position:sticky;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));order:2}.pages.two{grid-template-columns:minmax(0,1fr)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.intro,.lower,.result-top,.passes{grid-template-columns:minmax(0,1fr)}.sheetwrap{display:none}.sheetwrap.open{display:block}}
@media (min-width:701px){.sheettoggle{display:none}}
@media (max-width:420px){.grid{grid-template-columns:minmax(0,1fr)}.bub{width:40px}}

/* flikar */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:960px;margin:24px auto 4px}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:104px;padding:16px 12px;border:2px solid var(--line);border-radius:16px;background:var(--sheet);font-family:var(--f-display);font-weight:800;font-size:clamp(17px,2.4vw,21px);color:var(--soft);transition:border-color .15s,background .15s,transform .15s}
.tabs button svg{width:36px;height:36px}
.tabs button:hover{color:var(--ink);border-color:var(--soft);transform:translateY(-1px)}
#tab-prov.on{color:var(--form);border-color:var(--form);background:var(--form-tint)}
#tab-rt.on{color:var(--warn);border-color:var(--warn);background:var(--warn-tint)}
#tab-hr.on{color:var(--quant);border-color:var(--quant);background:var(--quant-tint)}
#tab-fr.on{color:var(--ok);border-color:var(--ok);background:var(--ok-tint)}

/* snabbräkning */
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 4px}
.subnav button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;font-size:14px}
.subnav button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.subnav button.subtle{margin-left:auto;border-style:dashed;font-size:13px;color:var(--soft)}
.subnav button.subtle.on{color:var(--paper)}
.warnbox{margin-top:14px;background:var(--warn-tint);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:14px}
.today{margin-top:18px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
.bignums{display:flex;gap:28px;flex-wrap:wrap;margin:10px 0 16px}
.bignums div{display:grid}
.bignums b{font-family:var(--f-display);font-size:44px;font-weight:800;line-height:1}
.catgroup + .catgroup{margin-top:22px}
.catgroup h3{font-size:18px;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--quant)}
.catitems{display:grid;gap:8px}
.catitem{border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
.catitem.open{border-color:var(--quant)}
.cathead{display:flex;align-items:center;gap:12px;padding:4px 6px 4px 12px}
.catname{flex:1;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;padding:12px 6px;text-align:left;font-weight:700;font-size:16px;min-height:44px}
.chev{color:var(--soft);font-size:14px}
input.sw{appearance:none;-webkit-appearance:none;flex:none;width:40px;height:24px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:left .15s}
input.sw:checked{background:var(--quant)}
input.sw:checked::after{left:19px}
.catbody{padding:4px 14px 14px;border-top:1px solid var(--line);background:var(--sheet)}
.panebtns{display:flex;gap:8px;margin:12px 0}
.panebtns button{flex:1;max-width:200px;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-weight:700}
.panebtns button.on{background:var(--quant);border-color:var(--quant);color:var(--paper)}
.catpane{display:grid;gap:8px}
.catpane .prow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.catpane input[type=number]{width:72px;font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.catpane .note{margin:0}
.tasklist{list-style:none;margin:0;padding:0;display:grid;max-height:420px;overflow:auto}
.tasklist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.tasklist li.off .tq{opacity:.5;text-decoration:line-through}
.tq{display:grid;font-family:var(--f-mono);font-size:14px}
.tq small{font-family:var(--f-body);font-size:12px}
.tbtns{display:flex;gap:6px;flex:none}
.tg{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:13px;white-space:nowrap}
.tg.star.on{background:var(--warn-tint);border-color:var(--warn);color:var(--warn)}
.tg.off.on{background:var(--bad-tint);border-color:var(--bad);color:var(--bad)}
.tg:disabled{opacity:.4;cursor:not-allowed}
.focus{display:grid;gap:10px;margin:12px 0 6px}
.focusseg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--paper);border:1px solid var(--line);width:fit-content;max-width:100%}
.focusseg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;color:var(--soft)}
.focusseg button.on{background:var(--ink);color:var(--paper)}
.focuschips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px}
.fchip.on{border-color:var(--quant);background:var(--quant-tint);color:var(--quant);font-weight:700}
/* Riktad träning */
.rtpage{display:grid;gap:16px;margin-top:22px}
.rtintro h2{font-size:24px}
.rtintro .note{max-width:70ch;margin:6px 0 0}
.rtarea h3{font-size:18px;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--line)}

<script>
// ================= Snabbräkning: kortbibliotek, rättning, FSRS och lagring =================
const SR = (function(){
const DAY = 86400000;
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pickr = a => a[Math.floor(Math.random()*a.length)];
const gcd = (a,b) => { a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a; };
const SUPD = '⁰¹²³⁴⁵⁶⁷⁸⁹';
const sup = n => String(n).split('').map(c=> c==='-' ? '⁻' : SUPD[+c]).join('');
const fmtN = x => { if (typeof x!=='number' || !isFinite(x)) return String(x); return Number(x.toPrecision(10)).toLocaleString('sv-SE',{maximumFractionDigits:6}); };
const M = '−';
const sgn = n => n<0 ? ` ${M} ${Math.abs(n)}` : ` + ${n}`;
const dayKey = (t=Date.now()) => { const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const endOfToday = () => { const d=new Date(); d.setHours(23,59,59,999); return d.getTime(); };
const isPrime = n => { if (n<2) return false; for (let i=2;i*i<=n;i++) if (n%i===0) return false; return true; };
const primeFactors = n => { const f=[]; for (let p=2;p*p<=n;p++) while(n%p===0){ f.push(p); n/=p; } if (n>1) f.push(n); return f; };
const factorStr = n => { const f=primeFactors(n), c={}; f.forEach(p=>c[p]=(c[p]||0)+1); return Object.entries(c).map(([p,k])=>k>1?p+sup(k):p).join(' · '); };

// ---------- Kategorier. Lägg till en ny genom att anropa cat(...) med fasta kort och/eller mallar. ----------
// limits = [Lätt under s, Bra under s]; långsammare än Bra blir Svårt.
const CATS = [];
// group: 'sr' = Snabbräkning (dagens repetition), 'hr' = Huvudräkning (egen kortlek och snabbtest)
function cat(id, name, limits, build, group='sr'){
  const c = {id, name, limits, group, cards:[]};
  const add = o => { o.cat = id; o.id = id+':'+o.id; c.cards.push(o); };
  build(add); CATS.push(c); return c;
}

  const FR = [[1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5],[3,5],[4,5],[1,6],[5,6],[1,7],[1,8],[3,8],[5,8],[7,8],[1,9],[1,10],[1,11],[1,12],[1,16],[1,20],[1,25],[1,40],[1,50]];
  const TIP = {'1/2':'Hälften är 50 %.','1/3':'1/3 = 0,333… ≈ 33,3 %.','2/3':'2 · 33,3 % ≈ 66,7 %.','1/4':'Hälften av hälften: 25 %.','3/4':'3 · 25 % = 75 %.','1/5':'100 / 5 = 20 %.','2/5':'2 · 20 % = 40 %.','3/5':'3 · 20 % = 60 %.','4/5':'4 · 20 % = 80 %.','1/6':'Hälften av 1/3: ≈ 16,7 %.','5/6':'100 % − 16,7 % ≈ 83,3 %.','1/7':'1/7 = 0,142857… ≈ 14,3 %. Värd att kunna utantill.','1/8':'Hälften av 1/4: 25 / 2 = 12,5 %.','3/8':'3 · 12,5 % = 37,5 %.','5/8':'50 % + 12,5 % = 62,5 %.','7/8':'100 % − 12,5 % = 87,5 %.','1/9':'1/9 = 0,111… ≈ 11,1 %.','1/10':'1/10 = 10 %.','1/11':'1/11 = 0,0909… ≈ 9,09 %.','1/12':'Hälften av 1/6: ≈ 8,33 %.','1/16':'Hälften av 1/8: 12,5 / 2 = 6,25 %.','1/20':'100 / 20 = 5 %.','1/25':'100 / 25 = 4 %.','1/40':'Hälften av 1/20: 2,5 %.','1/50':'100 / 50 = 2 %.'};
  for (const [p,q] of FR){
    const P = 100*p/q, rep = primeFactors(q).some(f=>f!==2&&f!==5);
    const ps = rep ? fmtN(Math.round(P*(P<10?100:10))/(P<10?100:10)) : fmtN(P);
    const tol = rep ? 0.004 : 0, ex = TIP[p+'/'+q];
    add({id:`${p}/${q}>pct`, kind:'pct', q:`${p}/${q} i procent`, ans:P, show:(rep?'≈ ':'')+ps+' %', tol, ex});
    add({id:`pct>${p}/${q}`, kind:'num', q:`${rep?'≈ ':''}${ps} % som bråk`, ans:p/q, show:`${p}/${q}`, tol, ex});
  }
  for (const [p,q] of [[1,8],[3,8],[5,8],[7,8],[1,16],[1,20],[1,25],[1,40],[1,50],[3,4],[3,5],[2,5]]){
    const d = fmtN(p/q), ex = (TIP[p+'/'+q]||'')+` Som decimaltal: ${d}.`;
    add({id:`${p}/${q}>dec`, kind:'num', q:`${p}/${q} som decimaltal`, ans:p/q, show:d, ex});
    add({id:`dec>${p}/${q}`, kind:'num', q:`${d} som bråk`, ans:p/q, show:`${p}/${q}`, ex});
  }
});

cat('forkorta','Förkorta bråk',[4,8], add=>{
  for (const [a,b] of [[12,18],[15,25],[14,21],[16,24],[18,24],[21,28],[24,36],[27,36],[35,56],[42,56],[45,60],[48,64],[36,48],[39,52],[51,68],[56,72],[63,81],[72,96],[75,100],[84,126],[91,117],[26,39],[57,76],[68,85],[34,51]]){
    const g = gcd(a,b);
    add({id:`${a}/${b}`, kind:'reduced', q:`Förkorta ${a}/${b}`, ans:a/b, show:`${a/g}/${b/g}`, ex:`Största gemensamma delaren är ${g}: ${a}/${g} = ${a/g} och ${b}/${g} = ${b/g}.`+(g===13||g===17||g===19?` Fällan: ${g} är en ovanlig faktor.`:'')});
  }
  add({id:'gen', tpl:true, name:'Förkorta (slumpat)', gen(){

cat('jamfor','Jämföra bråks storlek',[3,6], add=>{
  const cmp = (a,b,c,d,id) => {
    const big = a/b > c/d ? 0 : 1;
    return {id, kind:'choice', q:'Vilket är störst?', opts:[`${a}/${b}`,`${c}/${d}`], correct:big, show:big===0?`${a}/${b}`:`${c}/${d}`,
      ex:`Korsmultiplicera: ${a}·${d} = ${a*d} och ${c}·${b} = ${c*b}. ${a/b>c/d?`${a}/${b}`:`${c}/${d}`} är störst (${fmtN(Math.round(a/b*1000)/1000)} mot ${fmtN(Math.round(c/d*1000)/1000)}).`};
  };
  for (const [a,b,c,d] of [[5,8,3,5],[2,3,5,7],[3,4,7,9],[4,7,5,9],[7,12,3,5],[5,6,7,8],[2,5,3,8],[9,11,4,5],[11,12,10,11],[3,7,4,9],[5,12,3,7],[7,10,2,3],[4,9,3,7],[5,7,7,10],[3,11,1,4]]) add(cmp(a,b,c,d,`${a}/${b}-${c}/${d}`));
  add({id:'gen', tpl:true, name:'Jämför bråk (slumpat)', gen(){
    let a,b,c,d;
    do { b=ri(3,12); a=ri(1,b-1); d=ri(3,12); c=ri(1,d-1); } while (gcd(a,b)!==1 || gcd(c,d)!==1 || a*d===b*c || Math.abs(a/b-c/d)>0.08);
    const o = cmp(a,b,c,d,'x'); delete o.id; return o;
  }});
});

cat('tabell','Multiplikationstabellen',[2,4], add=>{
  const TWO = ['6*7','6*8','7*8'];
  const TIP = {'7*8':'5, 6, 7, 8: 56 = 7 · 8.','6*8':'6 · 8 = 48. Dubbla 6 · 4 = 24.','6*7':'6 · 7 = 42. 6 · 6 = 36, plus 6.','7*7':'7 · 7 = 49.','8*8':'8 · 8 = 64.','6*9':'6 · 9 = 54. 6 · 10 − 6.','7*9':'7 · 9 = 63. 70 − 7.','8*9':'8 · 9 = 72. 80 − 8.','12*12':'12 · 12 = 144.','7*12':'7 · 12 = 70 + 14 = 84.','8*12':'8 · 12 = 80 + 16 = 96.','11*12':'11 · 12 = 120 + 12 = 132.','7*11':'7 · 11 = 77.'};
  const tip = (a,b) => TIP[a+'*'+b] || (b===9||a===9 ? `${a} · ${b} = ${a*b}. Nio gånger: tio gånger minus en gång.` : b===11 ? `${a} · 11 = ${a*10} + ${a} = ${a*b}.` : b===12 ? `${a} · 12 = ${a*10} + ${a*2} = ${a*b}.` : `${a} · ${b} = ${a*b}.`);

    } else add({id:`${a}*${b}`, kind:'num', qf:()=> Math.random()<0.5 ? `${a} · ${b}` : `${b} · ${a}`, q:`${a} · ${b}`, ans:a*b, show:String(a*b), ex:tip(a,b)});

cat('konjtal','Kvadreringsregler med tal',[6,12], add=>{
  for (const [a,b] of [[51,49],[103,97],[19,21],[98,102],[31,29],[52,48],[62,58],[41,39],[71,69],[202,198]]){
    const m=(a+b)/2, d=Math.abs(a-b)/2;
    add({id:`${a}*${b}`, kind:'num', q:`${a} · ${b}`, ans:a*b, show:sp2(a*b), ex:`Konjugatregeln: (${m} + ${d})(${m} − ${d}) = ${m}² − ${d}² = ${sp2(m*m)} − ${d*d} = ${sp2(a*b)}.`});
  }
  for (const n of [99,101,21,49,51,29,31,19,61,79,999]){
    const b = Math.round(n/10)*10 === n ? n : (n%10<5 ? n-n%10 : n+(10-n%10)), base = n>=99 ? Math.round(n/100)*100 : b, d = n-base;
    add({id:`sq${n}`, kind:'num', q:`${n}²`, ans:n*n, show:sp2(n*n), ex:`(${base} ${d<0?'−':'+'} ${Math.abs(d)})² = ${sp2(base*base)} ${d<0?'−':'+'} ${sp2(2*base*Math.abs(d))} + ${d*d} = ${sp2(n*n)}.`});
  }
  for (const n of [35,45,55,65,95]) add({id:`sq${n}`, kind:'num', q:`${n}²`, ans:n*n, show:sp2(n*n), ex:`Slutar på 5: ${Math.floor(n/10)} · ${Math.floor(n/10)+1} = ${Math.floor(n/10)*(Math.floor(n/10)+1)}, sätt 25 efter: ${sp2(n*n)}.`});
  add({id:'genkonj', tpl:true, name:'(n + d)(n − d) (slumpat)', gen(){
    const m = pickr([20,30,40,50,60,70,80,90,100,200]), d = ri(1,4), [a,b] = Math.random()<0.5 ? [m+d,m-d] : [m-d,m+d];
    return {kind:'num', q:`${a} · ${b}`, ans:a*b, show:sp2(a*b), ex:`(${m} + ${d})(${m} − ${d}) = ${sp2(m*m)} − ${d*d} = ${sp2(a*b)}.`};
  }});
  add({id:'gensq', tpl:true, name:'(n ± d)² (slumpat)', gen(){
    const m = pickr([20,30,40,50,60,70,80,90,100]), d = ri(1,3)*pickr([1,-1]), n=m+d;
    return {kind:'num', q:`${n}²`, ans:n*n, show:sp2(n*n), ex:`(${m} ${d<0?'−':'+'} ${Math.abs(d)})² = ${sp2(m*m)} ${d<0?'−':'+'} ${sp2(2*m*Math.abs(d))} + ${d*d} = ${sp2(n*n)}.`};
  }});
  function sp2(n){ return fmtN(n); }
});

cat('algebra','Kvadreringsregler och konjugat med algebra',[10,20], add=>{

  const fixed = [
    ['f1','Faktorisera x² − 16','factor','(x+4)(x-4)','(x + 4)(x − 4)','Konjugatregeln baklänges: a² − b² = (a + b)(a − b), med a = x och b = 4.'],
    ['f2','Faktorisera x² + 6x + 9','factor','(x+3)^2','(x + 3)²','Första kvadreringsregeln baklänges: 6x = 2 · 3 · x och 9 = 3².'],
    ['e1','Utveckla (x − 5)²','expand','x^2-10x+25','x² − 10x + 25','(a − b)² = a² − 2ab + b²: x² − 2 · 5 · x + 25.'],
    ['s1','Förenkla (x² − 9)/(x − 3)','simplify','x+3','x + 3','x² − 9 = (x + 3)(x − 3). Förkorta bort (x − 3).'],
    ['f3','Faktorisera 4x² − 25','factor','(2x+5)(2x-5)','(2x + 5)(2x − 5)','4x² = (2x)² och 25 = 5².'],
    ['f4','Faktorisera x² − 10x + 25','factor','(x-5)^2','(x − 5)²','10x = 2 · 5 · x och 25 = 5².'],
    ['f5','Faktorisera 9 − y²','factor','(3+y)(3-y)','(3 + y)(3 − y)','9 = 3², konjugatregeln.'],
    ['e2','Utveckla (a + b)²','expand','a^2+2ab+b^2','a² + 2ab + b²','Första kvadreringsregeln.'],
    ['e3','Utveckla (a − b)(a + b)','expand','a^2-b^2','a² − b²','Konjugatregeln.'],
    ['f6','Faktorisera a² − 2ab + b²','factor','(a-b)^2','(a − b)²','Andra kvadreringsregeln baklänges.'],
    ['e4','Utveckla (2x + 3)²','expand','4x^2+12x+9','4x² + 12x + 9','(2x)² + 2 · 2x · 3 + 3².'],

    ['f7','Faktorisera x² − 1','factor','(x+1)(x-1)','(x + 1)(x − 1)','1 = 1², konjugatregeln.'],
    ['f8','Faktorisera 1 − 4t²','factor','(1+2t)(1-2t)','(1 + 2t)(1 − 2t)','4t² = (2t)².'],
    ['s3','Förenkla (y² + 10y + 25)/(y + 5)','simplify','y+5','y + 5','y² + 10y + 25 = (y + 5)². Förkorta bort en faktor (y + 5).'],
  ];

  }
  const V = ['x','y','a','t'];
  add({id:'gfk', tpl:true, name:'Faktorisera k²v² − b²', gen(){ const v=pickr(V), k=ri(1,4), b=ri(1,9);
    return {kind:'expr', mode:'factor', vars:[v], expr:`(${k}${v}+${b})(${k}${v}-${b})`, q:`Faktorisera ${k>1?k*k:''}${v}² ${M} ${b*b}`, show:`(${co(k,v)} + ${b})(${co(k,v)} ${M} ${b})`, ex:`${k>1?k*k:''}${v}² = (${co(k,v)})² och ${b*b} = ${b}². Konjugatregeln.`}; }});
  add({id:'gfq', tpl:true, name:'Faktorisera v² ± 2bv + b²', gen(){ const v=pickr(V), b=ri(1,9), s=pickr([1,-1]);
    return {kind:'expr', mode:'factor', vars:[v], expr:`(${v}${s>0?'+':'-'}${b})^2`, q:`Faktorisera ${v}² ${s>0?'+':M} ${2*b}${v} + ${b*b}`, show:`(${v} ${s>0?'+':M} ${b})²`, ex:`${2*b}${v} = 2 · ${b} · ${v} och ${b*b} = ${b}².`}; }});
  add({id:'geq', tpl:true, name:'Utveckla (kv ± b)²', gen(){ const v=pickr(V), k=ri(1,3), b=ri(1,9), s=pickr([1,-1]);
    return {kind:'expr', mode:'expand', vars:[v], expr:`(${k}${v}${s>0?'+':'-'}${b})^2`, q:`Utveckla (${co(k,v)} ${s>0?'+':M} ${b})²`, show:`${k>1?k*k:''}${v}² ${s>0?'+':M} ${2*k*b}${v} + ${b*b}`, ex:`(a ${s>0?'+':'−'} b)² = a² ${s>0?'+':'−'} 2ab + b², med a = ${co(k,v)} och b = ${b}.`}; }});
  add({id:'gek', tpl:true, name:'Utveckla (v + b)(v − b)', gen(){ const v=pickr(V), b=ri(1,12);

  add({id:'gs', tpl:true, name:'Förenkla med kvadreringsregel', gen(){ const v=pickr(V), b=ri(1,9), t=ri(0,3);
    const forms = [
      [`(${v}² ${M} ${b*b})/(${v} ${M} ${b})`, `${v}+${b}`, `${v} + ${b}`, `${v}² − ${b*b} = (${v} + ${b})(${v} − ${b}).`],
      [`(${v}² ${M} ${b*b})/(${v} + ${b})`, `${v}-${b}`, `${v} ${M} ${b}`, `${v}² − ${b*b} = (${v} + ${b})(${v} − ${b}).`],
      [`(${v}² + ${2*b}${v} + ${b*b})/(${v} + ${b})`, `${v}+${b}`, `${v} + ${b}`, `Täljaren är (${v} + ${b})².`],

    return {kind:'expr', mode:'simplify', vars:[v], expr:forms[1], q:`Förenkla ${forms[0]}`, show:forms[2], ex:forms[3]+' Förkorta bort den gemensamma faktorn.'}; }});
});

cat('hr-pct','Bråk ↔ procent (en decimal)',[3,6], add=>{
  const pct1 = (p,q) => Math.round(1000*p/q)/10;          // en decimal: 1/3 → 33,3
  const tip = (p,q) => q===8 ? `1/8 = 12,5 %, så ${p}/8 = ${p} · 12,5 = ${fmtN(pct1(p,8))} %.` : q===3 ? `1/3 = 33,33… ≈ 33,3 %.`+(p===2?' 2/3 ≈ 66,7 %.':'') : `1/4 = 25 %, så ${p}/4 = ${fmtN(pct1(p,4))} %.`;
  const seen = new Set();
  for (const q of [8,3,4]) for (let p=1;p<q;p++){
    const P = pct1(p,q), g = gcd(p,q);
    add({id:`${p}/${q}>pct`, kind:'pct', q:`${p}/${q} i procent`, ans:P, show:fmtN(P)+' %', tol:0, ex:tip(p,q)+' Svara med en decimal, t.ex. 33,3.'});
    // åt andra hållet: ett kort per procentvärde, svaret ska vara fullt förkortat

// ---------- Tolkning av svar ----------
const SUPMAP = {'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-'};
function norm(s){
  s = String(s).trim().toLowerCase()
    .replace(/[−–—]/g,'-').replace(/[·×∙•⋅]/g,'*').replace(/÷/g,'/').replace(/,/g,'.')
    .replace(/sqrt/g,'√').replace(/pi/g,'π').replace(/≈/g,'');
  s = s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻]+/g, m=>'^('+[...m].map(c=>SUPMAP[c]).join('')+')');
  s = s.replace(/½/g,'(1/2)').replace(/⅓/g,'(1/3)').replace(/¼/g,'(1/4)').replace(/¾/g,'(3/4)');
  return s.replace(/\s+/g,'');
}
function tokens(s){
  const out=[]; let i=0;
  while (i<s.length){
    const c = s[i];
    if (/[0-9.]/.test(c)){ let j=i; while (j<s.length && /[0-9.]/.test(s[j])) j++; const t=s.slice(i,j); if (!/^(\d+\.?\d*|\.\d+)$/.test(t)) throw 0; out.push({t:'n', v:parseFloat(t)}); i=j; continue; }
    if (/[a-zåäö]/.test(c)){ out.push({t:'v', v:c}); i++; continue; }
    if (c==='π'){ out.push({t:'n', v:Math.PI}); i++; continue; }
    if ('+-*/^()%√'.includes(c)){ out.push({t:c}); i++; continue; }
    throw 0;
  }
  return out;
}
function parse(src){
  const tk = tokens(norm(src)); let p = 0;
  const peek = () => tk[p], eat = t => (tk[p] && tk[p].t===t) ? (p++, true) : false;
  function expr(){ let a=term(); while (peek() && (peek().t==='+'||peek().t==='-')){ const op=tk[p++].t; a={t:op, a, b:term()}; } return a; }
  function term(){ let a=unary(); for(;;){ const q=peek(); if (!q) break;
    if (q.t==='*'||q.t==='/'){ p++; a={t:q.t, a, b:unary()}; }
    else if (q.t==='n'||q.t==='v'||q.t==='('||q.t==='√'){ a={t:'*', a, b:power()}; }
    else break; } return a; }
  function unary(){ if (eat('-')) return {t:'neg', a:unary()}; if (eat('+')) return unary(); return power(); }
  function power(){ const a=postfix(); if (eat('^')) return {t:'^', a, b:unary()}; return a; }
  function postfix(){ let a=primary(); while (eat('%')) a={t:'pct', a}; return a; }
  function primary(){ const q=tk[p++]; if (!q) throw 0;
    if (q.t==='n') return {t:'num', v:q.v};
    if (q.t==='v') return {t:'var', v:q.v};
    if (q.t==='('){ const e=expr(); if (!eat(')')) throw 0; return {t:'par', a:e}; }
    if (q.t==='√') return {t:'sqrt', a:power()};
    throw 0; }
  const r = expr(); if (p<tk.length) throw 0; return r;
}
function ev(n, env){
  switch(n.t){
    case 'num': return n.v; case 'var': return env && n.v in env ? env[n.v] : NaN; case 'par': return ev(n.a,env);
    case '+': return ev(n.a,env)+ev(n.b,env); case '-': return ev(n.a,env)-ev(n.b,env);
    case '*': return ev(n.a,env)*ev(n.b,env); case '/': return ev(n.a,env)/ev(n.b,env);
    case '^': return Math.pow(ev(n.a,env), ev(n.b,env)); case 'neg': return -ev(n.a,env);
    case 'sqrt': return Math.sqrt(ev(n.a,env)); case 'pct': return ev(n.a,env)/100;
  }
  return NaN;
}
const hasVar = n => n.t==='var' || ['a','b'].some(k=>n[k] && hasVar(n[k]));
const unpar = n => { while (n.t==='par') n = n.a; return n; };
const close = (a,b,tol) => tol ? Math.abs(a-b) <= tol*Math.abs(b) + 1e-12 : Math.abs(a-b) <= 1e-9*Math.max(1,Math.abs(b));
const UNITS = /\s*(km\/h|m\/s|cm²|cm2|dm²|dm2|m²|m2|km²|dm³|dm3|cm³|cm3|m³|m3|liter|l|ml|dl|minuter|min|timmar|h|°|grader|kr|km)\s*$/i;
function numVal(raw){ const t = parse(String(raw).replace(UNITS,'')); if (hasVar(t)) throw 0; const v = ev(t); if (!isFinite(v)) throw 0; return v; }

// returnerar {ok, note?} eller {invalid:true}
function check(inst, raw, tolOverride){
  const tol = tolOverride ?? inst.tol ?? 0;
  try{
    switch(inst.kind){
      case 'num': { const v = numVal(raw); return {ok: close(v, inst.ans, tol)}; }
      case 'pct': {
        const hasPct = /%/.test(raw), v = numVal(String(raw).replace(/%/g,''));
        const targets = [inst.ans, ...(inst.alt||[])];
        const ok = targets.some(t => close(v, t, tol)) || (!hasPct && !/\//.test(raw) && targets.some(t => t!==0 && close(v, t/100, tol)));
        return {ok};
      }
      case 'reduced': {
        const s = norm(raw), m = s.match(/^(-?\d+)\/(\d+)$/);
        const v = numVal(raw);
        if (!close(v, inst.ans)) return {ok:false};
        if (m && gcd(+m[1], +m[2])!==1) return {ok:false, note:'Rätt värde, men bråket är inte fullt förkortat.'};
        if (!m && !Number.isInteger(v)) return {ok:false, note:'Skriv svaret som ett förkortat bråk, till exempel 2/3.'};
        return {ok:true};
      }
      case 'factor': {
        const s = String(raw).trim().toLowerCase();
        const claimPrime = s==='__prime__' || /^prim/.test(s);
        if (claimPrime) return {ok:isPrime(inst.n), note: isPrime(inst.n) ? null : `${inst.n} är inte ett primtal.`};
        if (isPrime(inst.n)) return {ok:false, note:`${inst.n} är ett primtal. Tryck på Primtal.`};
        const parts = norm(s).replace(/x/g,'*').split('*').filter(Boolean);
        let prod = 1, allPrime = true;
        for (const part of parts){
          const m = part.match(/^(\d+)(?:\^\(?(\d+)\)?)?$/); if (!m) return {invalid:true};
          const b = +m[1], k = m[2] ? +m[2] : 1;
          if (!isPrime(b)) allPrime = false;
          prod *= b**k;
        }
        if (prod!==inst.n) return {ok:false};
        if (!allPrime) return {ok:false, note:'Rätt produkt, men alla faktorer är inte primtal. Faktorisera vidare.'};
        return {ok:true};
      }
      case 'choice': return {ok: Number(raw)===inst.correct};
      case 'expr': {
        const u = parse(raw), e = parse(inst.expr);
        let tested = 0;
        for (let i=0;i<14 && tested<6;i++){
          const env = {}; for (const v of inst.vars) env[v] = (Math.random()*7.4 - 3.7) || 1.13;
          const want = ev(e, env); if (!isFinite(want)) continue;
          const got = ev(u, env); tested++;
          if (!isFinite(got) || Math.abs(got-want) > 1e-6*Math.max(1,Math.abs(want))) return {ok:false};
        }
        if (tested<3) return {invalid:true};
        const r = unpar(u);
        if (inst.mode==='factor' && (r.t==='+' || r.t==='-' || r.t==='/' || !hasVar(r))) return {ok:false, note:'Rätt värde, men skriv det som en produkt, till exempel (x + 4)(x − 4).'};
        if (inst.mode==='expand' && /[()]/.test(raw.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]/g,''))) return {ok:false, note:'Rätt värde, men utveckla helt, utan parenteser.'};
        if (inst.mode==='simplify' && /\//.test(raw)) return {ok:false, note:'Rätt värde, men förenkla bort bråkstrecket.'};
        if (inst.mode==='power'){ const okForm = r.t==='var' || r.t==='num' || (r.t==='^' && unpar(r.a).t==='var' && !hasVar(r.b)); if (!okForm) return {ok:false, note:'Rätt värde, men skriv det som en enda potens, till exempel a^8.'}; }
        return {ok:true};
      }
    }
  }catch(e){ return {invalid:true}; }
  return {invalid:true};
}

// ---------- FSRS-5 med standardparametrar ----------
const W = [0.40255,1.18385,3.173,15.69105,7.1949,0.5345,1.4604,0.0046,1.54575,0.1192,1.01925,1.9395,0.11,0.29605,2.2698,0.2315,2.9898,0.51655,0.6621];
const DECAY = -0.5, FACTOR = 19/81;
const clampD = d => Math.min(10, Math.max(1, d));
const retr = (t,S) => Math.pow(1 + FACTOR*t/S, DECAY);
const ivlDays = (S, r) => S/FACTOR*(Math.pow(r, 1/DECAY) - 1);
const D0 = g => clampD(W[4] - Math.exp(W[5]*(g-1)) + 1);
const nextD = (D,g) => { const dp = D - W[6]*(g-3); return clampD(W[7]*D0(4) + (1-W[7])*(D + (dp-D)*(10-D)/9)); };
const recallS = (D,S,r,g) => S*(1 + Math.exp(W[8])*(11-D)*Math.pow(S,-W[9])*(Math.exp(W[10]*(1-r))-1)*(g===2?W[15]:1)*(g===4?W[16]:1));
const forgetS = (D,S,r) => Math.min(S, W[11]*Math.pow(D,-W[12])*(Math.pow(S+1,W[13])-1)*Math.exp(W[14]*(1-r)));
const shortS = (S,g) => S*Math.exp(W[17]*(g-3+W[18]));
function schedule(c, g, now, ret){
  c = Object.assign({st:'new', S:0, D:0, due:now, last:0, reps:0, lapses:0}, c||{});
  const toReview = () => { const days = Math.min(365, Math.max(1, Math.round(ivlDays(c.S, ret) * (1 + (Math.random()-0.5)*0.1)))); c.st='review'; c.due = now + days*DAY; };
  if (c.st==='new'){
    c.S = W[g-1]; c.D = D0(g);
    if (g===1){ c.st='learn'; c.due = now + 60e3; } else if (g===2){ c.st='learn'; c.due = now + 5*60e3; } else toReview();
  } else if (c.st==='learn' || c.st==='relearn'){
    c.S = shortS(c.S, g); c.D = nextD(c.D, g);
    if (g===1) c.due = now + 60e3; else if (g===2) c.due = now + 5*60e3; else toReview();
  } else {
    const t = Math.max(0, (now - c.last)/DAY), r = retr(t, c.S);
    if (g===1){ c.lapses++; c.S = forgetS(c.D, c.S, r); c.D = nextD(c.D, g); c.st='relearn'; c.due = now + 60e3; }
    else { c.S = recallS(c.D, c.S, r, g); c.D = nextD(c.D, g); toReview(); }
  }
  c.reps++; c.last = now;
  return c;
}

// ---------- Lagring: schemat i ett dokument, försöken i ett dokument per dag ----------
const LKEY = 'provpass-sr-v1';
// Standardval: dessa kategorier är avstängda, och i "Förkorta bråk" är bråk med täljare > 30 och
// nämnare > 50 samt den slumpade mallen avstängda. Allt går att slå på igen under Kategorier.
const DEFAULT_OFF_CATS = ['primtal','konjtal','tripplar'];
const DEFAULTS_V = 3;
// bråk med täljare > 30 och nämnare > 50, plus den slumpade mallen, i en förkortningskategori
function bigFractionCards(catId){
  const out = {};
  for (const k of CATBY[catId].cards){
    if (k.tpl){ out[k.id] = true; continue; }
    const [a,b] = k.id.split(':')[1].split('/').map(Number);
    if (a > 30 && b > 50) out[k.id] = true;
  }
  return out;
}
const defaultOffCards = () => Object.assign(bigFractionCards('forkorta'), bigFractionCards('hr-fork'));
const defSettings = () => ({active:Object.fromEntries(CATS.map(c=>[c.id, !DEFAULT_OFF_CATS.includes(c.id)])), newPerDay:15, passMode:'cards', passCards:20, passMin:5, retention:0.9, limits:{}, tol:{}, star:{}, off:defaultOffCards(), quizN:20,
  focusMode:{sr:'all', hr:'all'}, focus:{sr:[], hr:[]}, auto:true, defaultsV:DEFAULTS_V, updated:0});
// Sparade inställningar från en äldre version får standardvalen en gång. Ändrar du dem sedan behålls dina val.
function applyDefaultsOnce(st){
  const v = st.defaultsV||0;
  if (v >= DEFAULTS_V) return;
  // varje version tillämpas bara en gång, så att det du själv slagit på igen inte stängs av på nytt
  if (v < 2){ for (const id of DEFAULT_OFF_CATS) st.active[id] = false; st.off = Object.assign({}, st.off, bigFractionCards('forkorta')); }
  if (v < 3) st.off = Object.assign({}, st.off, bigFractionCards('hr-fork'));
  st.focusMode = Object.assign({sr:'all', hr:'all'}, st.focusMode); st.focus = Object.assign({sr:[], hr:[]}, st.focus);
  st.defaultsV = DEFAULTS_V; st.updated = Date.now();
}
const S = {state:{cards:{}, settings:defSettings(), newDays:{}}, log:[], mode:'local', db:null, uid:null, attached:false, loaded:false, stateTimer:null, logTimer:null, chain:Promise.resolve(), dirtyDays:new Set(), error:null};
function loadLocal(){
  try{ const raw = localStorage.getItem(LKEY); if (!raw) return; const o = JSON.parse(raw);
    if (o.state){ S.state.cards = o.state.cards||{}; S.state.newDays = o.state.newDays||{}; S.state.settings = Object.assign(defSettings(), o.state.settings||{}); S.state.settings.active = Object.assign(defSettings().active, (o.state.settings||{}).active||{}); S.state.settings.defaultsV = (o.state.settings||{}).defaultsV||0; applyDefaultsOnce(S.state.settings); if (o.state.timeMs!=null) S.state.timeMs = o.state.timeMs; }

}
function saveLocal(){
  try{
    const cut = Date.now() - 30*DAY;
    const log = S.mode==='db' ? S.log.filter(a=>!a.s || a.t>cut) : S.log;
    localStorage.setItem(LKEY, JSON.stringify({state:S.state, log}));

}
function mergeState(into, other){

  for (const [id,c] of Object.entries(other.cards||{})){ const mine = into.cards[id]; if (!mine || (c.last||0) > (mine.last||0)) into.cards[id] = c; }
  for (const [d,n] of Object.entries(other.newDays||{})) into.newDays[d] = Math.max(into.newDays[d]||0, n);

function mergeLog(list){ const have = new Map(S.log.map(a=>[a.id,a])); for (const a of list){ const m = have.get(a.id); if (!m) { have.set(a.id, a); } else if (a.s) m.s = 1; } S.log = [...have.values()].sort((a,b)=>a.t-b.t); }

async function attach(db, uid){
  if (S.attached) return; S.attached = true;
  if (!db || !uid){ S.mode='local'; S.loaded=true; rerender(); return; }
  S.db = db; S.uid = uid;
  try{
    const timeout = new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),10000));
    const snap = await Promise.race([stateRef().get(), timeout]);
    if (snap.exists) mergeState(S.state, JSON.parse(JSON.stringify(snap.data())));
    const q = await Promise.race([db.collection('data/users/'+uid).where('kind','==','srlog').get(), timeout]);
    for (const d of q.docs){ const body = d.data(); if (Array.isArray(body.attempts)) mergeLog(body.attempts.map(a=>Object.assign({}, a, {s:1}))); }

}
function queueState(ms=1200){

function queueLog(ms=1500){

      const theirs = snap.exists && Array.isArray(snap.data().attempts) ? snap.data().attempts : [];
      const mine = S.log.filter(a=>a.day===day && String(a.c)===c);

}

const set = () => S.state.settings;

const passCats = (group='sr') => set().focusMode?.[group]==='pick' ? CATS.filter(c=>c.group===group && (set().focus?.[group]||[]).includes(c.id)) : activeCats(group);

function dueList(group='sr'){

    .sort((a,b)=> (isStar(b)-isStar(a)) || S.state.cards[a.id].due - S.state.cards[b.id].due);   // oftare-markerade först

function newList(group='sr'){

const newToday = (group='sr') => S.state.newDays[newKey(group)] || 0;
const shuffleS = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

  view = 'pass'; nextCard();
}
// Snabbtest: n slumpade kort ur Huvudräkning, oberoende av schemat. Oftare-markerade väger dubbelt.
function startQuiz(n){
  const pool = activeCards('hr');
  if (!pool.length){ toast('Inga aktiva uppgifter i Huvudräkning. Slå på någon kategori under Kategorier.'); return; }
  const picked = pool.map(k=>({k, r: Math.pow(Math.random(), 1/(isStar(k)?2:1))})).sort((a,b)=>b.r-a.r).map(x=>x.k);
  const queue = []; while (queue.length < n) queue.push(...(queue.length ? shuffleS(picked) : picked));
  pass = {queue: queue.slice(0,n), pending:[], done:[], start:Date.now(), extraNew:0, group:'hr', quiz:n, cur:null};
  view = 'pass'; nextCard();
}
function passOver(){
  if (pass.quiz) return pass.done.length >= pass.quiz;
  const s = set();
  return s.passMode==='cards' ? pass.done.length >= s.passCards : (Date.now()-pass.start) >= s.passMin*60e3;
}
function nextCard(){
  if (passOver() || (!pass.queue.length && !pass.pending.length)){ pass.cur = null; view='summary'; rerender(); return; }
  const now = Date.now();
  pass.pending.sort((a,b)=>S.state.cards[a.id].due - S.state.cards[b.id].due);
  let card;
  if (pass.pending.length && S.state.cards[pass.pending[0].id].due <= now) card = pass.pending.shift();
  else if (pass.queue.length) card = pass.queue.shift();
  else card = pass.pending.shift();
  pass.cur = {card, inst:makeInst(card), shown:0, answered:null};
  rerender();
}
function answer(raw, display){
  const cur = pass.cur; if (!cur || cur.answered) return;
  const ms = Math.round(performance.now() - cur.shown);
  const res = check(cur.inst, raw);
  if (res.invalid){ toast('Svaret gick inte att tolka. Kontrollera skrivsättet.'); return; }
  const [easy, good] = limitsOf(cur.card.cat);
  const g = !res.ok ? 1 : ms < easy*1000 ? 4 : ms < good*1000 ? 3 : 2;
  const now = Date.now(), prev = S.state.cards[cur.card.id];
  // tid i passet: sedan förra svaret (högst 3 min, så att en paus inte räknas)
  S.state.timeMs = srTime() + Math.min(now - (pass.mark || pass.start), 180e3); pass.mark = now;
  if (!prev && !pass.quiz){ const grp = groupOf(cur.card); S.state.newDays[newKey(grp)] = newToday(grp) + 1; }
  const next = schedule(prev, g, now, set().retention);
  // "oftare": halva intervallet till nästa repetition
  if (isStar(cur.card) && next.st==='review') next.due = now + Math.max(DAY, (next.due - now)/2);
  S.state.cards[cur.card.id] = next;
  const count = S.log.filter(a=>a.day===dayKey(now)).length;
  const att = {id: now.toString(36)+Math.random().toString(36).slice(2,6), t:now, day:dayKey(now), c:Math.floor(count/700), cat:cur.card.cat, card:cur.card.id, q:cur.inst.q, a:display ?? String(raw), ans:cur.inst.show, ok:res.ok?1:0, ms, g, next:next.due};
  S.log.push(att);
  S.dirtyDays.add(att.day+'|'+att.c);
  queueState(); queueLog();
  cur.answered = {ok:res.ok, g, ms, note:res.note, mine: display ?? String(raw), next:next.due};
  pass.done.push(att);
  if (!pass.quiz && next.due - now < 20*60e3) pass.pending.push(cur.card);
  rerender();
  if (res.ok && g>=3 && set().auto){ const me = cur; setTimeout(()=>{ if (pass && pass.cur===me) nextCard(); }, 650); }
}

const GRADE = {1:'Igen',2:'Svårt',3:'Bra',4:'Lätt'};
const median = a => { if (!a.length) return null; const s=a.slice().sort((x,y)=>x-y), m=Math.floor(s.length/2); return s.length%2 ? s[m] : (s[m-1]+s[m])/2; };
const fmtS = ms => ms==null ? '–' : fmtN(Math.round(ms/100)/10)+' s';
function catStats(){
  const end = endOfToday();
  return CATS.map(c=>{
    const att = S.log.filter(a=>a.cat===c.id);
    const okT = att.filter(a=>a.ok).map(a=>a.ms);
    let learned=0, due=0, fresh=0;
    for (const k of c.cards){ const st=S.state.cards[k.id]; if (!st) fresh++; else { if (st.st==='review') learned++; if (st.due<=end) due++; } }
    return {c, n:att.length, ok:att.filter(a=>a.ok).length, med:median(okT), learned, due, fresh, total:c.cards.length};
  });
}
function weakest(){
  const by = {};
  for (const a of S.log){ (by[a.card] ||= []).push(a); }
  return Object.entries(by).filter(([,l])=>l.length>=2).map(([id,l])=>{
    const card = CARDS[id]; if (!card) return null;
    const lim = limitsOf(card.cat)[1]*1000, recent = l.slice(-8);
    const wrong = recent.filter(a=>!a.ok).length/recent.length;
    const med = median(recent.filter(a=>a.ok).map(a=>a.ms));
    const slow = med==null ? 1 : Math.min(1.5, med/lim);
    return {card, n:l.length, wrong, med, score: wrong*2 + slow*0.6 + (S.state.cards[id]?.lapses||0)*0.15};
  }).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,15);
}
const csvCell = v => { const s = v==null ? '' : String(v); return /[;"\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
const isoLocal = t => { const d=new Date(t); return dayKey(t)+' '+[d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':'); };
function csv(){
  const head = ['datum','kategori','kort-id','fråga','mitt svar','rätt svar','rätt/fel','svarstid (ms)','betyg','nästa repetition'];
  const rows = S.log.map(a=>[isoLocal(a.t), CATBY[a.cat]?.name||a.cat, a.card, a.q, a.a, a.ans, a.ok?'rätt':'fel', a.ms, GRADE[a.g], isoLocal(a.next)]);
  return '﻿'+[head, ...rows].map(r=>r.map(csvCell).join(';')).join('\r\n');
}
async function offerFile(filename, data, box){
  try{
    const dl = window.claude?.use ? await claude.use('downloads') : null;
    if (dl){ await dl.save({filename, data}); toast('Filen är sparad.'); return; }
  }catch(e){ if (e && e.code==='declined') return; }
  // Fristående app: dela-menyn på mobil (Spara i Filer, AirDrop …), annars en vanlig nedladdning.
  const type = /\.json$/i.test(filename) ? 'application/json' : /\.csv$/i.test(filename) ? 'text/csv' : 'text/plain';
  try{
    const file = new File([data], filename, {type});
    if (IS_MOBILE && navigator.canShare?.({files:[file]})){ await navigator.share({files:[file]}); return; }
    const url = URL.createObjectURL(file);

}

async function restore(file, box){
  let o; try{ o = JSON.parse(await file.text()); }catch(e){ toast('Filen är inte en giltig säkerhetskopia.'); return; }
  if (o.app!=='provpass-hp' || !o.snabbrakning){ toast('Filen är inte en säkerhetskopia från Provpass HP.'); return; }
  const before = S.log.length;
  mergeState(S.state, o.snabbrakning.state);
  mergeLog((o.snabbrakning.log||[]).map(a=>Object.assign({}, a, {s:0})));
  for (const a of S.log) if (!a.s) S.dirtyDays.add(a.day+'|'+a.c);
  if (o.gamlaProv){
    const g = o.gamlaProv;
    const seen = new Set(P.sessions.map(s=>s.d)); for (const s of g.sessions||[]) if (!seen.has(s.d)) P.sessions.push(s);
    P.sessions.sort((a,b)=>b.d.localeCompare(a.d));
    const mk = new Map(P.mistakes.map(m=>[m.key,m])); for (const m of g.mistakes||[]){ const mine = mk.get(m.key); if (!mine || m.d > mine.d) mk.set(m.key, m); }
    P.mistakes = [...mk.values()].sort((a,b)=>b.d.localeCompare(a.d));

}

async function pageText(doc, p){
  const page = await doc.getPage(p);
  const tc = await page.getTextContent();
  const items = tc.items.filter(i=>typeof i.str==='string' && i.str.trim()).map(i=>({s:i.str, x:i.transform[4], y:i.transform[5], w:i.width||0}));
  // rader i läsordning; textbitar som ligger kant i kant slås ihop ("20"+"25"+"-"+"10" → "2025-10")
  const lines = [];
  for (const it of items.slice().sort((a,b)=> Math.abs(a.y-b.y)>3 ? b.y-a.y : a.x-b.x)){
    const l = lines[lines.length-1];
    if (l && Math.abs(l.y-it.y)<=3) l.items.push(it); else lines.push({y:it.y, items:[it]});
  }
  for (const l of lines){
    l.items.sort((a,b)=>a.x-b.x);
    let s = ''; l.offs = [];
    l.items.forEach((it,i)=>{ const prev = l.items[i-1]; s += (prev && it.x - (prev.x+prev.w) > 1.5 ? ' ' : ''); l.offs.push({at:s.length, x:it.x}); s += it.s; });
    l.s = s;
  }
  return {items, lines, str: lines.map(l=>l.s).join('\n')};
}
function parseFacit(t, date){
  const head = t.lines.find(l=>/Provpass\s*\d/.test(l.s));
  if (!head) return 0;
  const topY = head.y;
  const cols = [];
  for (const m of head.s.matchAll(/Provpass\s*(\d)/g)){
    let x = null; for (const o of head.offs) if (o.at <= m.index) x = o.x;
    if (x!=null) cols.push({x, pass:+m[1]});
  }
  cols.sort((a,b)=>a.x-b.x);
  if (!cols.length) return 0;
  const toks = [];
  for (const it of t.items){ if (it.y >= topY-2) continue; for (const w of it.s.trim().split(/\s+/)) toks.push({w, x:it.x, y:it.y}); }
  toks.sort((a,b)=> Math.abs(a.y-b.y)>3 ? b.y-a.y : a.x-b.x);
  const out = {};
  const put = (n, L, x) => {
    let ci = -1; for (let i=0;i<cols.length;i++) if (cols[i].x <= x+30) ci = i;
    if (ci<0 || n<1 || n>40) return;
    const pass = cols[ci].pass; (out[pass] ||= Array(40).fill(null))[n-1] = L;
  };
  for (let i=0;i<toks.length;i++){
    const a = toks[i].w, m = a.match(/^(\d{1,2})([A-E])$/);
    if (m) { put(+m[1], m[2], toks[i].x); continue; }
    if (/^\d{1,2}$/.test(a) && toks[i+1] && /^[A-E]$/.test(toks[i+1].w) && Math.abs(toks[i+1].y-toks[i].y)<4){ put(+a, toks[i+1].w, toks[i].x); i++; }
  }
  let count = 0;
  for (const [pass, arr] of Object.entries(out)){ (LIB.facits[date] ||= {})[pass] = arr; count++; }
  return count;
}

  for (let p=2; p<=doc.numPages; p++){

    for (const it of t.items){ const m = it.s.match(/^\s*(\d{1,2})\.(\s|$)/); if (m){ const n=+m[1]; if (n>=1 && n<=40 && !(n in qp)) qp[n]=p; } }
  }
  // behåll bara uppgifter vars sidor kommer i stigande ordning
  const out = {}; let last = 0;
  for (let n=1;n<=40;n++){ if (n in qp && qp[n] >= last){ out[n]=qp[n]; last=qp[n]; } }
  return out;
}
async function parseFile(f){
  const doc = await pdfjsLib.getDocument({data:new Uint8Array(f.buf.slice(0)), isEvalSupported:false, useSystemFonts:true, verbosity:0}).promise;
  const t1 = await pageText(doc, 1);
  const date = (t1.str.match(/(\d{4}-\d{2}-\d{2})/)||[])[1];
  if (/Facit/i.test(t1.str) && !/Svarsh/i.test(t1.str)){
    const n = date ? parseFacit(t1, date) : 0;
    doc.destroy();
    if (!n) LIB.problems.push(`${f.name}: ser ut som ett facit men gick inte att läsa.`);
    return;
  }
  const pm = t1.str.match(/Provpass\s*(\d)/);
  if (!date || !pm){ LIB.problems.push(`${f.name}: hittade inget datum eller provpass på första sidan.`); doc.destroy(); return; }
  const kind = /Kvantitativ del|XYZ/.test(t1.str) ? 'k' : /Verbal del|ORD/.test(t1.str) ? 'v' : null;
  if (!kind){ LIB.problems.push(`${f.name}: kunde inte avgöra om passet är verbalt eller kvantitativt.`); doc.destroy(); return; }
  const key = date+'|'+pm[1];
  let qpage = {};
  if (KNOWN_PAGES[key]) KNOWN_PAGES[key].forEach((p,i)=>{ if (p<=doc.numPages) qpage[i+1]=p; });
  else qpage = await findQuestionPages(doc);
  if (LIB.tests[key]) LIB.tests[key].doc.destroy?.();
  LIB.tests[key] = {key, date, pass:+pm[1], kind, name:f.name, doc, pages:doc.numPages, qpage, facit:null};
}

const canvasCache = new Map();
async function renderPage(test, p, cssWidth){
  const w = Math.min(1600, Math.round(cssWidth * Math.min(2, window.devicePixelRatio||1)));
  const k = test.key+'|'+p+'|'+w;
  if (canvasCache.has(k)) return canvasCache.get(k);
  const page = await test.doc.getPage(p);
  const vp0 = page.getViewport({scale:1});
  const vp = page.getViewport({scale: w/vp0.width});
  const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
  if (canvasCache.size > 24) canvasCache.delete(canvasCache.keys().next().value);
  canvasCache.set(k, c);
  return c;
}
function pagesFor(test, n){
  const p = test.qpage[n]; if (!p) return [];
  const qpages = new Set(Object.values(test.qpage));
  return (p-1 >= 2 && !qpages.has(p-1)) ? [p-1, p] : [p];
}
function pageBox(test, p, cssWidth){
  const box = el('div',{class:'pg'}, el('span',{class:'busy'}, el('span',{class:'spin'}), 'Sidan ritas…'));
  renderPage(test, p, cssWidth).then(c=>{ const img = c.cloneNode(); img.getContext('2d').drawImage(c,0,0); img.setAttribute('aria-label',`Sida ${p} i provhäftet`); img.setAttribute('role','img'); put(box, img); }).catch(()=>put(box, 'Sidan kunde inte visas.'));
  return box;
}

// ---------- Beskärning: varje uppgift visas för sig ----------
// Rutan går från uppgiftens nummer ned till nästa uppgift i samma kolumn. Text som hör till alla
// uppgifter på sidan (t.ex. LÄS-texten ovanför "Uppgifter") följer med överst. Vridna sidor (DTK)
// och sidor med bara en uppgift visas hela.
const CROP = { on: (()=>{ try{ return localStorage.getItem('provpass-crop')!=='off'; }catch(e){ return true; } })(),
  set(v){ this.on=v; try{ localStorage.setItem('provpass-crop', v?'on':'off'); }catch(e){} } };
const QMARK = /^\s*(\d{1,2})\.(\s|$)/;
async function questionCrop(test, n){
  test.crops ||= {};
  if (n in test.crops) return test.crops[n];
  let crop = null;
  try{
    const p = test.qpage[n];
    const onPage = new Set(Object.entries(test.qpage).filter(([,q])=>q===p).map(([k])=>+k));
    if (p && onPage.size>1){
      const page = await test.doc.getPage(p);
      const [L,B,R,T] = page.view, W = R-L;
      const items = (await page.getTextContent()).items.filter(i=>typeof i.str==='string' && i.str.trim());
      const rotated = items.some(i=>Math.abs(i.transform[1])>0.01 || Math.abs(i.transform[2])>0.01);
      if (!rotated){
        const by = {};
        for (const it of items){
          const m = it.str.match(QMARK); if (!m || !onPage.has(+m[1])) continue;
          const k = {n:+m[1], x:it.transform[4], y:it.transform[5]}, b = by[k.n];
          if (!b || k.x < b.x-2 || (Math.abs(k.x-b.x)<=2 && k.y > b.y)) by[k.n] = k;
        }
        const me = by[n], marks = Object.values(by);
        if (me && marks.length>1){
          const cols = []; for (const x of marks.map(m=>m.x).sort((a,b)=>a-b)) if (!cols.length || x-cols[cols.length-1] > 40) cols.push(x);
          const ci = cols.findIndex((x,i)=> me.x >= x-1 && (i===cols.length-1 || me.x < cols[i+1]-1));
          const inCol = m => m.x >= cols[ci]-1 && (ci===cols.length-1 || m.x < cols[ci+1]-1);
          const below = marks.filter(m=>inCol(m) && m.y < me.y-4).sort((a,b)=>b.y-a.y)[0];
          // kolumngränser: undvik grannkolumnens text och skiljelinjen mellan kolumnerna
          const box = { x0: Math.max(L, cols[ci]-(ci>0 ? 26 : 40)), x1: ci<cols.length-1 ? cols[ci+1]-34 : R-16,
                        top: Math.min(T, me.y+24), bottom: below ? below.y+16 : B+56 };
          // gemensam text ovanför uppgifterna: rubriken "Uppgifter", annars innehåll ovanför första uppgiften
          const topMark = Math.max(...marks.map(m=>m.y));
          const head = items.filter(i=>/^\s*Uppgifter\s*$/.test(i.str) && i.transform[5] > me.y).sort((a,b)=>a.transform[5]-b.transform[5])[0];
          // räknas bara om det finns minst tre rader text där (inte bara en avsnittsrubrik)
          const linesAbove = b => { const ys = items.map(i=>i.transform[5]).filter(y=> y > b && y < T-30).sort((a,c)=>c-a); return ys.filter((y,i)=> i===0 || ys[i-1]-y > 6).length; };
          let ctxBottom = head ? head.transform[5]+16 : topMark+24;
          if (linesAbove(ctxBottom) < 3) ctxBottom = null;
          crop = {p, L, T, W, box, ctx: ctxBottom!=null && ctxBottom > me.y+12 ? {x0:L, x1:R, top:T-6, bottom:ctxBottom} : null};
          if (crop.ctx) crop.box.top = Math.min(crop.box.top, ctxBottom);
        }
      }
    }
  }catch(e){ crop = null; }
  return (test.crops[n] = crop);
}
function cropBox(test, n, p, cssWidth){
  const box = el('div',{class:'pg crop'}, el('span',{class:'busy'}, el('span',{class:'spin'}), 'Uppgiften ritas…'));
  (async()=>{
    const crop = await questionCrop(test, n);
    // förstora uppgiften så att den fyller bredden (främst på mobil), men högst till 1000 px sidbredd
    let pageCss = cssWidth;
    if (crop && crop.p===p){ const cw = Math.max(...[crop.box, crop.ctx].filter(Boolean).map(r=>r.x1-r.x0)); pageCss = Math.max(cssWidth, Math.min(1000, cssWidth*crop.W/cw)); }
    const c = await renderPage(test, p, pageCss);
    cssWidth = pageCss;
    if (!crop || crop.p!==p){ const img = c.cloneNode(); img.getContext('2d').drawImage(c,0,0); img.setAttribute('aria-label',`Sida ${p} i provhäftet`); img.setAttribute('role','img'); box.classList.remove('crop'); put(box, img); return; }
    const s = c.width / crop.W, gap = Math.round(14*s);
    const parts = crop.ctx ? [crop.ctx, crop.box] : [crop.box];
    const hs = parts.map(r=>Math.max(1, Math.round((r.top-r.bottom)*s)));
    const out = document.createElement('canvas');
    out.width = Math.round(Math.max(...parts.map(r=>r.x1-r.x0))*s);
    out.height = hs.reduce((a,b)=>a+b,0) + gap*(parts.length-1);
    const g = out.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,out.width,out.height);
    let y = 0;
    parts.forEach((r,i)=>{
      const sw = Math.round((r.x1-r.x0)*s);
      g.drawImage(c, Math.round((r.x0-crop.L)*s), Math.round((crop.T-r.top)*s), sw, hs[i], 0, y, sw, hs[i]);
      y += hs[i];
      if (i<parts.length-1){ g.fillStyle = '#DCDFE6'; g.fillRect(Math.round(16*s), y+Math.round(gap/2), out.width-Math.round(32*s), Math.max(1,Math.round(s))); y += gap; }
    });
    out.style.width = Math.round(out.width * cssWidth / c.width)+'px';
    out.setAttribute('role','img'); out.setAttribute('aria-label',`Uppgift ${n}, sida ${p} i provhäftet`);
    put(box, out);
  })().catch(()=>put(box, 'Uppgiften kunde inte visas.'));
  return box;
}
// sidorna för en uppgift: uppgiftens egen sida beskärs, en tillhörande textsida (LÄS/DTK) visas hel
function taskBoxes(test, n, pages, cssWidth){
  return pages.map(p => CROP.on && p===test.qpage[n] ? cropBox(test, n, p, cssWidth) : pageBox(test, p, cssWidth));
}

Enligt det officiella facit är rätt svar ${r.answer}. Elevens svar: ${r.chosen || 'inget svar'}.

let view = 'home', session = null, tick = null, result = null;
function itemsFor(test, secFilter){
  const out = [];
  for (let n=1;n<=40;n++){
    if (!test.qpage[n]) continue;
    const sec = secOf(test.kind, n);
    if (secFilter && sec!==secFilter) continue;

// extra: t.ex. {rt:{sec, instant}, deadline} för Riktad träning (sätts före första renderingen)
function startSession(items, label, extra={}){
  if (!items.length){ toast('Det finns inga uppgifter att öva på här.'); return; }
  const now = Date.now();
  session = Object.assign({label, items, chosen:{}, times:{}, lock:{}, cur:0, start:now, last:now, deadline: now + TIME_LIMIT}, extra);

}
// tiden räknas inte vidare på en uppgift som redan är besvarad med "Visa svaret direkt"
function accrue(){ const s=session, now=Date.now(); if (!s.lock?.[s.cur]) s.times[s.cur]=(s.times[s.cur]||0)+(now-s.last); s.last=now; }
function goTo(i){ const s=session; if (i<0||i>=s.items.length||i===s.cur) return; accrue(); s.cur=i; renderQuiz(); window.scrollTo({top:0}); }
function pick(L){
  const s=session;
  if (s.rt?.instant){ if (s.lock[s.cur]) return; accrue(); s.chosen[s.cur]=L; s.lock[s.cur]=true; renderSide(); return; }
  if (s.chosen[s.cur]===L) delete s.chosen[s.cur]; else s.chosen[s.cur]=L; renderSide();
}
function onTick(){
  if (view!=='quiz' || !session) return;
  const left = session.deadline - Date.now();
  const c = $('#clock');
  if (c){
    // Riktad träning: tiden får gå över, då visas "+m:ss" i orange i stället för att passet lämnas in
    c.querySelector('.big').textContent = left >= 0 ? fmtTime(left) : '+'+fmtTime(-left);
    c.classList.toggle('low', !session.rt && left < 5*60*1000); c.classList.toggle('over', !!session.rt && left < 0);
  }

  if (left <= 0 && !session.rt){ toast('Tiden är slut. Passet har lämnats in.'); submit(); }
}
function submit(){
  const s = session; if (!s) return;
  accrue(); clearInterval(tick);
  tasks();   // uppgiftsloggen fylls på med äldre fel innan det här passet räknas in
  const rows = s.items.map((it,i)=>{
    const chosen = s.chosen[i] || null, ms = s.times[i] || 0, pace = SEC[it.sec].pace*1000;
    const status = !it.answer ? 'nofacit' : !chosen ? 'blank' : chosen===it.answer ? 'ok' : 'bad';
    let tag = null;
    if (status==='bad' || status==='blank') tag = ms < 3000 && status==='blank' ? 'skipped' : ms < 0.5*pace ? 'fast' : ms > 1.5*pace ? 'slow' : 'norm';
    return Object.assign({}, it, {chosen, ms, status, tag, pace});
  });
  const graded = rows.filter(r=>r.status!=='nofacit');
  const correct = graded.filter(r=>r.status==='ok').length;
  const used = s.rt ? Date.now()-s.start : Math.min(TIME_LIMIT, Date.now()-s.start);
  { const now = Date.now(); for (const r of graded) logTask(r, now); }
  // spara statistik, pass och alla felsvar
  const bySec = {};
  for (const r of graded){
    const st = P.stats[r.sec] || (P.stats[r.sec] = {n:0,c:0,ms:0,fast:0,slow:0});
    st.n++; if (r.status==='ok') st.c++; st.ms += r.ms;
    if (r.tag==='fast') st.fast=(st.fast||0)+1; if (r.tag==='slow') st.slow=(st.slow||0)+1;
    const b = bySec[r.sec] || (bySec[r.sec] = {n:0,c:0}); b.n++; if (r.status==='ok') b.c++;
    const key = r.tk+'|'+r.n, at = P.mistakes.findIndex(m=>m.key===key);
    if (r.status==='bad' || r.status==='blank'){
      const rec = {key, tk:r.tk, n:r.n, sec:r.sec, chosen:r.chosen, answer:r.answer, ms:r.ms, tag:r.tag, d:new Date().toISOString(), fixed:false, times:(at>=0?(P.mistakes[at].times||1)+1:1), ex: at>=0 ? P.mistakes[at].ex : null, ftype: at>=0 ? P.mistakes[at].ftype : null, what: at>=0 ? P.mistakes[at].what : '', lesson: at>=0 ? P.mistakes[at].lesson : ''};
      if (at>=0) P.mistakes.splice(at,1);
      P.mistakes.unshift(rec);
    } else if (r.status==='ok' && at>=0){ P.mistakes[at].fixed = true; P.mistakes[at].fixedD = new Date().toISOString(); }
  }
  P.mistakes = P.mistakes.slice(0, 800);
  if (graded.length){
    // delprovsloggen: en rad per delprov i passet (fylls på med äldre historik först, före unshift)
    const log = delprovRows(), now = new Date().toISOString();
    for (const [sec,b] of Object.entries(bySec)){
      const ms = graded.filter(r=>r.sec===sec).reduce((a,r)=>a+(r.ms||0),0);
      log.push({id:uid(), d:now, tk:s.tk||null, label:s.label, sec, c:b.c, n:b.n, ms, src:'app'});
    }
    const tt = provTotals();   // räknas före unshift, så att passet inte räknas två gånger
    tt.ms += used;
    if (s.tk && !s.sec){ tt.full++; if (!tt.passes.includes(s.tk)) tt.passes.push(s.tk); } else tt.sec++;
    P.sessions.unshift({d:new Date().toISOString(), label:s.label, tk:s.tk||null, sec:s.sec||null, n:graded.length, c:correct, ms:used, bySec});
  }

  result = {label:s.label, rows, correct, graded:graded.length, used, plan: s.deadline - s.start, rt: s.rt||null, nofacit: rows.filter(r=>r.status==='nofacit')};
  session = null; view='result'; render(); window.scrollTo(0,0);
  autoExplain();
}

// ---------- Mönster i felen ----------
function analyse(rows){
  const wrong = rows.filter(r=>r.status==='bad'||r.status==='blank');
  const fast = wrong.filter(r=>r.tag==='fast'), slow = wrong.filter(r=>r.tag==='slow'), skipped = wrong.filter(r=>r.tag==='skipped');
  const okRows = rows.filter(r=>r.status==='ok');
  const out = [];
  if (!wrong.length) out.push('Inga fel i det här passet. Bra jobbat!');
  if (fast.length) out.push(`${fast.length} fel gjordes på mindre än halva riktmärkestiden (${fast.map(r=>r.sec+' '+r.n).join(', ')}). Där finns risk för slarvfel: läs frågan en gång till och kontrollera svaret innan du går vidare.`);
  if (slow.length) out.push(`${slow.length} fel tog mer än 1,5 gånger riktmärket (${slow.map(r=>r.sec+' '+r.n).join(', ')}). Där finns risk för en kunskapslucka: repetera grunderna för de här uppgiftstyperna.`);
  if (skipped.length) out.push(`${skipped.length} ${skipped.length===1?'uppgift lämnades obesvarad':'uppgifter lämnades obesvarade'} utan att du hann titta på dem. Det blir inget minusavdrag för fel svar, så gissa hellre än att lämna tomt.`);
  const bySec = {};
  for (const r of rows.filter(r=>r.status!=='nofacit')){ const b = bySec[r.sec] || (bySec[r.sec]={sec:r.sec,n:0,c:0,ms:0,fast:0,slow:0,pace:r.pace}); b.n++; b.ms+=r.ms; if (r.status==='ok') b.c++; if (r.tag==='fast') b.fast++; if (r.tag==='slow') b.slow++; }
  const secs = Object.values(bySec);
  const worst = secs.filter(b=>b.n>=3).sort((a,b)=>a.c/a.n-b.c/b.n)[0];
  if (worst && worst.c < worst.n) out.push(`Svagast i det här passet: ${worst.sec} (${worst.c} av ${worst.n} rätt).`);
  for (const b of secs){
    if (b.fast>=2 && b.fast>=b.slow) out.push(`I ${b.sec} dominerar snabba fel. Du har troligen tid att sakta ner där.`);
    else if (b.slow>=2) out.push(`I ${b.sec} tar felen lång tid. Det tyder mer på att något moment behöver övas än på slarv.`);
  }
  if (okRows.length && wrong.length){
    const avg = a => a.reduce((s,r)=>s+r.ms/r.pace,0)/a.length;
    const ro = avg(okRows), rw = avg(wrong.filter(r=>r.tag!=='skipped')) || 0;
    if (rw && rw < ro*0.7) out.push('Dina fel gick i snitt klart snabbare än dina rätta svar. Det pekar mot slarv snarare än okunskap.');
    if (rw && rw > ro*1.4) out.push('Dina fel tog i snitt klart längre tid än dina rätta svar. Det pekar mot kunskapsluckor snarare än slarv.');
  }
  return {out, secs};
}
const TAGTXT = {fast:'Snabbt fel · risk för slarv', slow:'Långsamt fel · risk för lucka', norm:'Normal tid', skipped:'Ej besvarad'};

let tab = 'prov';
const TABS = [['tab-prov','prov'],['tab-rt','rt'],['tab-hr','hr'],['tab-fr','fr']];
function setTab(t){
  if (t===tab) return;
  if ((tab==='prov' || tab==='rt') && view==='quiz' && session){ toast(tab==='rt' ? 'Lämna in eller avbryt träningen först.' : 'Lämna in eller avbryt provpasset först.'); return; }
  if (tab==='hr' && !SR.canLeave()) return;
  tab = t;
  // ett avslutat pass hör till fliken där det gjordes
  if (view==='result' && result && !!result.rt !== (tab==='rt')) view = 'home';
  for (const [id,name] of TABS){ const b=$('#'+id); b.classList.toggle('on', tab===name); if (tab===name) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); }
  try{ localStorage.setItem('provpass-tab', tab); }catch(e){}
  render(); window.scrollTo(0,0);
}
function render(){
  if (tab==='hr') return SR.render($('#app'));
  if (tab==='fr') return renderProgress();
  if (tab==='rt'){
    if (view==='quiz' && session?.rt) return renderQuiz();
    if (view==='result' && result?.rt) return renderResult();
    return renderRT();
  }
  if (view==='home' || (view==='quiz' && !session) || (view==='result' && result?.rt)) renderHome();
  else if (view==='quiz') renderQuiz();
  else if (view==='result') renderResult();
}
// Provets namn efter termin: januari–juni är våren, juli–december hösten
const examSeason = date => { const [y,m] = String(date).split("-").map(Number); return (m<=6 ? "våren" : "hösten")+" "+y; };
const examName = date => "Prov från "+examSeason(date);
const examShort = date => { const s = examSeason(date); return s[0].toUpperCase()+s.slice(1); };
// Totaler för gamla prov. Passhistoriken sparar bara de 60 senaste, så totalerna sparas för sig
// (första gången räknas de fram ur den historik som finns).
function provTotals(){
  if (!P.totals){
    const t = {ms:0, full:0, sec:0, passes:[]};
    for (const s of P.sessions){ t.ms += s.ms||0; if (s.tk && !s.sec){ t.full++; if (!t.passes.includes(s.tk)) t.passes.push(s.tk); } else t.sec++; }
    P.totals = t;
  }
  return P.totals;
}

const FTYPES = ['Kunskapslucka','Slarvfel','Tidsbrist/gissning','Missförstod frågan'];
const suggestFtype = tag => tag==='fast' ? 'Slarvfel' : tag==='skipped' ? 'Tidsbrist/gissning' : tag==='slow' ? 'Kunskapslucka' : null;
const SECN = {ORD:10, 'LÄS':10, MEK:10, ELF:10, XYZ:12, KVA:10, NOG:6, DTK:12};
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
// delprovsloggen saknar gräns; första gången fylls den på med de pass som redan finns i historiken
function delprovRows(){
  if (!P.delprovInit){
    P.delprov ||= [];
    for (const s of P.sessions.slice().reverse()) for (const [sec,b] of Object.entries(s.bySec||{}))
      P.delprov.push({id:uid(), d:s.d, tk:s.tk||null, label:s.label, sec, c:b.c, n:b.n, ms:null, src:'app'});
    P.delprovInit = true;
  }
  return P.delprov;
}

const fmtHP = v => v==null || v==='' || isNaN(v) ? '–' : Number(v).toLocaleString('sv-SE',{minimumFractionDigits:2, maximumFractionDigits:2});
const parseHP = s => { const v = parseFloat(String(s).replace(',','.')); return isFinite(v) && v>=0 && v<=2 ? Math.round(v*100)/100 : null; };
const fmtDay = d => { const x = new Date(d); return isNaN(x) ? (d||'–') : x.toLocaleDateString('sv-SE'); };
const fmtDur = ms => { const m = Math.round((ms||0)/60000); if (m < 60) return m+' min'; const h = Math.floor(m/60), r = m%60; return h+' h'+(r ? ' '+r+' min' : ''); };

function daysLeft(){
  if (!P.examDate) return null;
  const d = new Date(P.examDate+'T08:00:00'); if (isNaN(d)) return null;
  return Math.ceil((d - new Date())/86400000);
}

function downloadFile(name, text){
  const file = new File([text], name, {type:'text/csv'});
  if (IS_MOBILE && navigator.canShare?.({files:[file]})){ navigator.share({files:[file]}).catch(()=>{}); return; }
  const url = URL.createObjectURL(file), a = el('a',{href:url, download:name}); document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 10000); toast('Filen är sparad i Hämtade filer.');
}

const svgEsc = s => String(s).replace(/[<&>"]/g, c=>({'<':'&lt;','&':'&amp;','>':'&gt;','"':'&quot;'}[c]));
// enkla SVG-diagram som följer appens färger i ljust och mörkt läge
function lineChart(rows, goal){
  const W=640, H=240, L=40, R=16, T=16, B=44, pts = rows.filter(r=>r.t!=null);
  const PX = 56, x = i => L + PX + (pts.length<2 ? (W-L-R-2*PX)/2 : i*(W-L-R-2*PX)/(pts.length-1)), y = v => T + (2-v)/2*(H-T-B);
  const svg = ['<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Normerat resultat över tid jämfört med målet" class="chart">'];
  for (const v of [0,0.5,1,1.5,2]) svg.push(`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" class="ax">${fmtHP(v)}</text>`);
  if (goal!=null) svg.push(`<line x1="${L}" x2="${W-R}" y1="${y(goal)}" y2="${y(goal)}" class="goal"/><text x="${W-R}" y="${y(goal)-6}" text-anchor="end" class="goaltxt">Mål ${fmtHP(goal)}</text>`);
  if (pts.length>1) svg.push(`<polyline points="${pts.map((p,i)=>x(i)+','+y(p.t)).join(' ')}" class="line"/>`);
  pts.forEach((p,i)=>{
    svg.push(`<circle cx="${x(i)}" cy="${y(p.t)}" r="5" class="dot"/><text x="${x(i)}" y="${y(p.t)-10}" text-anchor="middle" class="val">${fmtHP(p.t)}</text>`);
    svg.push(`<text x="${x(i)}" y="${H-B+18}" text-anchor="middle" class="ax">${svgEsc(String(p.name||p.date||'').slice(0,16))}</text>`);
  });
  if (!pts.length) svg.push(`<text x="${W/2}" y="${H/2}" text-anchor="middle" class="ax">Lägg till ett helprov för att se kurvan.</text>`);
  svg.push('</svg>');
  const d = el('div',{class:'chartwrap'}); d.innerHTML = svg.join(''); return d;
}
function barChart(stats){
  const W=640, H=220, L=40, R=10, T=16, B=34, n=stats.length, bw=(W-L-R)/n;
  const y = v => T + (1-v)*(H-T-B);
  const svg = ['<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Procent rätt per delprov" class="chart">'];
  for (const v of [0,0.25,0.5,0.75,1]) svg.push(`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" class="ax">${Math.round(v*100)} %</text>`);

// grön = rätt inom 1,5 × riktmärket, orange = rätt men långsamt, röd = fel eller obesvarad.
// Varje uppgift får också ett FSRS-schema (samma algoritm som korten i Huvudräkning), så att

const SLOW = 1.5;
const taskColor = (ok, ms, pace) => !ok ? 'red' : ms > SLOW*pace ? 'orange' : 'green';
function tasks(){
  if (!P.tasks){
    P.tasks = {};
    for (const m of P.mistakes) P.tasks[m.key] = {tk:m.tk, n:m.n, sec:m.sec, st:m.fixed ? 'green' : 'red', tries:m.times||1, last:Date.parse(m.d)||Date.now(), ms:m.ms, fs:null, hist:[]};
  }

}
function logTask(r, now){
  const T = tasks(), key = r.tk+'|'+r.n, ok = r.status==='ok', pace = SEC[r.sec].pace*1000;
  const st = taskColor(ok, r.ms, pace);
  const g = !ok ? 1 : r.ms > SLOW*pace ? 2 : r.ms < 0.5*pace ? 4 : 3;   // Igen / Svårt / Lätt / Bra
  const t = T[key] || (T[key] = {tk:r.tk, n:r.n, sec:r.sec, tries:0, hist:[], fs:null});
  t.tries++; t.st = st; t.last = now; t.ms = r.ms;
  t.hist = [...(t.hist||[]), {d:now, c:st, ms:r.ms}].slice(-10);
  try{ t.fs = SR.schedule(t.fs, g, now, 0.9); }catch(e){}
}

function pickItems(sec, mode, n){
  const T = tasks(), pool = availableItems(sec), key = i => i.tk+'|'+i.n;
  let list;
  if (mode==='err'){
    // tidigare fel: de som är på väg att glömmas (förfallna enligt schemat) först
    list = pool.filter(i=>['red','orange'].includes(T[key(i)]?.st)).sort((a,b)=>(T[key(a)].fs?.due||0) - (T[key(b)].fs?.due||0));
  } else {
    // nya: aldrig gjorda först (slumpade), sedan de du gjort minst antal gånger
    const unseen = shuffle(pool.filter(i=>!T[key(i)])), seen = pool.filter(i=>T[key(i)]).sort((a,b)=>(T[key(a)].tries-T[key(b)].tries) || (T[key(a)].last-T[key(b)].last));
    list = [...unseen, ...seen];
  }
  // samma provhäfte och ordning i följd, så att uppgifter som delar text (LÄS, DTK) hamnar efter varandra
  return list.slice(0, n).sort((a,b)=> a.tk===b.tk ? a.n-b.n : a.tk.localeCompare(b.tk));
}
function startRT(sec, mode, n, instant){

  const plan = items.reduce((a,i)=>a+SEC[i.sec].pace*1000, 0);
  tab==='rt' || setTab('rt');
  startSession(items, `Riktad träning · ${sec}`+(mode==='err' ? ' · tidigare fel' : ''), {rt:{sec, mode, n, instant}, sec, deadline: Date.now()+plan});
}
